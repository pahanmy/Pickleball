<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball Pro-Maker by Pahan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase Compat (Sesuai untuk penggunaan tanpa bundler) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        
        // Konfigurasi Firebase disediakan oleh persekitaran
        const firebaseConfig = JSON.parse(window.__firebase_config || '{}');
        const appId = window.__app_id || 'pickleball-pro-pahan';
        
        let db, auth;
        if (window.firebase) {
            try {
                const app = firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.firestore();
            } catch (e) {
                console.error("Firebase gagal dimuatkan:", e);
            }
        }

        const Icon = ({ name, className = "w-5 h-5" }) => {
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [sessions, setSessions] = useState([]);
            const [currentSessionId, setCurrentSessionId] = useState(null);
            const [view, setView] = useState('menu');
            const [sessionDate, setSessionDate] = useState(new Date().toISOString().split('T')[0]);
            const [inputName, setInputName] = useState('');
            const [players, setPlayers] = useState([]);
            const [teams, setTeams] = useState([]);
            const [schedule, setSchedule] = useState([]);
            const [scores, setScores] = useState({});
            const [playersPerTeam, setPlayersPerTeam] = useState(2);
            const [isGenerated, setIsGenerated] = useState(false);
            const [activeTab, setActiveTab] = useState('players');
            const [isSaving, setIsSaving] = useState(false);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // Rule 3: Auth sebelum query
            useEffect(() => {
                if (!auth) return;
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    if (u) {
                        setUser(u);
                    } else {
                        auth.signInAnonymously().catch(console.error);
                    }
                });
                return () => unsubscribe();
            }, []);

            // Ambil senarai sesi
            useEffect(() => {
                if (!user || !db) return;
                
                // Rule 1: Gunakan path yang betul
                const sessionsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions');
                
                const unsubscribe = sessionsRef.onSnapshot((snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    // Rule 2: Susun di memori
                    setSessions(data.sort((a, b) => new Date(b.date) - new Date(a.date)));
                }, (err) => console.error("Firestore Error:", err));

                return () => unsubscribe();
            }, [user]);

            // Ambil data sesi aktif
            useEffect(() => {
                if (!user || !currentSessionId || !db) return;
                const sessionDoc = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions').doc(currentSessionId);
                
                const unsubscribe = sessionDoc.onSnapshot((snapshot) => {
                    if (snapshot.exists) {
                        const data = snapshot.data();
                        setPlayers(data.players || []);
                        setTeams(data.teams || []);
                        setSchedule(data.schedule || []);
                        setScores(data.scores || {});
                        setPlayersPerTeam(data.playersPerTeam || 2);
                        setIsGenerated(data.isGenerated || false);
                        setSessionDate(data.date);
                    }
                }, (err) => console.error("Sync Error:", err));

                return () => unsubscribe();
            }, [user, currentSessionId]);

            const createNewSession = async () => {
                if (!user || !db) return;
                setIsSaving(true);
                try {
                    const sessionsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions');
                    const newDoc = await sessionsRef.add({
                        date: sessionDate,
                        players: [],
                        teams: [],
                        schedule: [],
                        scores: {},
                        playersPerTeam: 2,
                        isGenerated: false,
                        createdAt: new Date().toISOString()
                    });
                    setCurrentSessionId(newDoc.id);
                    setView('active');
                    setActiveTab('players');
                } catch (e) { 
                    console.error(e); 
                } finally { 
                    setIsSaving(false); 
                }
            };

            const syncToCloud = async (newData) => {
                if (!user || !currentSessionId || !db) return;
                try {
                    const sessionDoc = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions').doc(currentSessionId);
                    await sessionDoc.update(newData);
                } catch (e) {
                    console.error("Update Error:", e);
                }
            };

            const addPlayer = (e) => {
                e.preventDefault();
                if (!inputName.trim()) return;
                const names = inputName.split(/[\n,]+/).map(n => n.trim()).filter(n => n !== "" && !players.includes(n));
                const updatedPlayers = [...players, ...names];
                setPlayers(updatedPlayers);
                syncToCloud({ players: updatedPlayers });
                setInputName('');
            };

            const generateEverything = () => {
                if (players.length < playersPerTeam * 2) return alert(`Minimum ${playersPerTeam * 2} pemain diperlukan.`);
                const shuffled = [...players].sort(() => Math.random() - 0.5);
                const newTeams = [];
                for (let i = 0; i < shuffled.length; i += playersPerTeam) {
                    newTeams.push(shuffled.slice(i, i + playersPerTeam));
                }
                const newSchedule = [];
                for (let i = 0; i < newTeams.length; i++) {
                    for (let j = i + 1; j < newTeams.length; j++) {
                        newSchedule.push({ home: i, away: j });
                    }
                }
                syncToCloud({ 
                    teams: newTeams, 
                    schedule: newSchedule, 
                    scores: {}, 
                    isGenerated: true, 
                    playersPerTeam 
                });
                setActiveTab('schedule');
            };

            const updateScore = (matchIdx, side, value) => {
                const newScores = { 
                    ...scores, 
                    [matchIdx]: { 
                        ...scores[matchIdx], 
                        [side]: parseInt(value) || 0, 
                        completed: true 
                    } 
                };
                setScores(newScores);
                syncToCloud({ scores: newScores });
            };

            const stats = useMemo(() => {
                const teamStats = teams.map((_, i) => ({ id: i + 1, points: 0, wins: 0, members: teams[i] }));
                const pStats = {};
                players.forEach(p => pStats[p] = { points: 0, wins: 0 });
                
                Object.entries(scores).forEach(([idx, data]) => {
                    if (!data.completed) return;
                    const m = schedule[idx];
                    if (!m) return;
                    
                    const hScore = data.home || 0;
                    const aScore = data.away || 0;
                    
                    if (hScore > aScore) {
                        const winTeamIdx = m.home;
                        teamStats[winTeamIdx].points += 2;
                        teamStats[winTeamIdx].wins += 1;
                        teams[winTeamIdx].forEach(p => { if(pStats[p]) { pStats[p].points += 2; pStats[p].wins += 1; } });
                    } else if (aScore > hScore) {
                        const winTeamIdx = m.away;
                        teamStats[winTeamIdx].points += 2;
                        teamStats[winTeamIdx].wins += 1;
                        teams[winTeamIdx].forEach(p => { if(pStats[p]) { pStats[p].points += 2; pStats[p].wins += 1; } });
                    }
                });
                
                return {
                    teams: [...teamStats].sort((a, b) => b.points - a.points),
                    players: Object.entries(pStats).map(([name, s]) => ({ name, ...s })).sort((a, b) => b.points - a.points)
                };
            }, [scores, teams, schedule, players]);

            if (view === 'menu') {
                return (
                    <div className="min-h-screen p-4 md:p-8 max-w-2xl mx-auto animate-in fade-in duration-500">
                        <header className="text-center mb-10">
                            <div className="inline-flex items-center justify-center p-4 bg-lime-400 rounded-3xl mb-4 shadow-xl">
                                <Icon name="trophy" className="w-10 h-10 text-slate-900" />
                            </div>
                            <h1 className="text-4xl font-black tracking-tight">Pickleball Pro-Maker</h1>
                            <p className="text-slate-500 italic mt-1 font-medium">by Pahan</p>
                        </header>

                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 mb-6">
                            <h2 className="font-bold mb-4 flex items-center gap-2 text-lime-600">
                                <Icon name="plus" /> Sesi Baru
                            </h2>
                            <div className="flex flex-col sm:flex-row gap-3">
                                <input 
                                    type="date" 
                                    value={sessionDate} 
                                    onChange={e => setSessionDate(e.target.value)} 
                                    className="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:ring-2 focus:ring-lime-500" 
                                />
                                <button 
                                    onClick={createNewSession} 
                                    disabled={isSaving} 
                                    className="bg-slate-900 text-white px-6 py-3 rounded-xl font-bold hover:bg-slate-800 transition-all disabled:opacity-50"
                                >
                                    {isSaving ? "Mula..." : "Mula Sesi"}
                                </button>
                            </div>
                        </div>

                        <div className="space-y-3">
                            <h2 className="text-xs font-black text-slate-400 uppercase tracking-widest px-2 flex items-center gap-2">
                                <Icon name="history" className="w-4 h-4" /> Rekod Sesi Terdahulu
                            </h2>
                            {sessions.length === 0 ? (
                                <div className="text-center py-10 bg-white rounded-3xl border border-dashed text-slate-400 italic">
                                    Tiada rekod disimpan.
                                </div>
                            ) : (
                                sessions.map(s => (
                                    <button 
                                        key={s.id} 
                                        onClick={() => { setCurrentSessionId(s.id); setView('active'); }} 
                                        className="w-full flex items-center justify-between p-5 bg-white rounded-2xl border border-slate-100 hover:border-lime-400 hover:shadow-md transition-all group"
                                    >
                                        <div className="flex items-center gap-4 text-left">
                                            <div className="w-12 h-12 bg-slate-50 rounded-xl flex items-center justify-center font-black text-slate-400 group-hover:bg-lime-50 group-hover:text-lime-600">
                                                {new Date(s.date).getDate()}
                                            </div>
                                            <div>
                                                <div className="font-bold text-slate-800">
                                                    {new Date(s.date).toLocaleDateString('ms-MY', { month: 'short', year: 'numeric', day: 'numeric' })}
                                                </div>
                                                <div className="text-xs text-slate-400">
                                                    {s.players?.length || 0} Pemain • {s.isGenerated ? "Selesai" : "Draf"}
                                                </div>
                                            </div>
                                        </div>
                                        <Icon name="chevron-right" className="text-slate-300 group-hover:text-lime-500" />
                                    </button>
                                ))
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-4xl mx-auto pb-24 animate-in fade-in duration-300">
                    <header className="flex items-center justify-between mb-8">
                        <button onClick={() => setView('menu')} className="flex items-center gap-2 text-slate-500 font-bold hover:text-slate-900 transition-all">
                           <Icon name="chevron-left" /> Menu Utama
                        </button>
                        <div className="text-right">
                           <div className="text-[10px] font-black text-slate-400 uppercase tracking-tighter">Tarikh Perlawanan:</div>
                           <div className="font-bold text-slate-900">{new Date(sessionDate).toLocaleDateString('ms-MY')}</div>
                        </div>
                    </header>

                    <nav className="flex bg-white p-1 rounded-xl border border-slate-200 mb-6 sticky top-4 z-10 shadow-sm overflow-x-auto">
                        {[
                            { id: 'players', label: 'Pemain', icon: 'users' },
                            { id: 'schedule', label: 'Jadual', icon: 'calendar' },
                            { id: 'leaderboard', label: 'Kedudukan', icon: 'medal' }
                        ].map(tab => (
                            <button 
                                key={tab.id} 
                                onClick={() => isGenerated || tab.id === 'players' ? setActiveTab(tab.id) : null} 
                                className={`flex-1 min-w-[100px] flex items-center justify-center gap-2 py-3 rounded-lg text-sm font-bold capitalize transition-all ${activeTab === tab.id ? 'bg-slate-900 text-white' : 'text-slate-500 hover:bg-slate-50'} ${!isGenerated && tab.id !== 'players' ? 'opacity-30 cursor-not-allowed' : ''}`}
                            >
                                <Icon name={tab.icon} className="w-4 h-4" /> {tab.label}
                            </button>
                        ))}
                    </nav>

                    {activeTab === 'players' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                <h2 className="font-bold mb-4 flex items-center gap-2 text-slate-700">
                                    <Icon name="user-plus" className="text-lime-600" /> Daftar Pemain
                                </h2>
                                <form onSubmit={addPlayer} className="flex gap-2 mb-6">
                                    <input 
                                        type="text" 
                                        value={inputName} 
                                        onChange={e => setInputName(e.target.value)} 
                                        placeholder="Nama pemain..." 
                                        className="flex-1 px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-lime-500" 
                                    />
                                    <button className="bg-slate-900 text-white px-4 rounded-xl hover:bg-slate-800 transition-colors">
                                        <Icon name="plus" />
                                    </button>
                                </form>
                                <div className="space-y-2 max-h-[400px] overflow-y-auto pr-2">
                                    {players.length === 0 ? (
                                        <div className="text-center py-10 text-slate-400 italic">Belum ada pemain</div>
                                    ) : (
                                        players.map((p, i) => (
                                            <div key={i} className="flex justify-between items-center p-3 bg-slate-50 rounded-xl font-bold border border-transparent hover:border-slate-200 transition-all">
                                                <span>{i+1}. {p}</span>
                                                <button onClick={() => { 
                                                    const up = players.filter((_, idx) => idx !== i); 
                                                    setPlayers(up); 
                                                    syncToCloud({ players: up }); 
                                                }} className="text-slate-300 hover:text-red-500 transition-colors">
                                                    <Icon name="trash-2" className="w-4 h-4" />
                                                </button>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                            
                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-center text-center">
                                <h2 className="font-bold mb-4 text-slate-700">Format Perlawanan</h2>
                                <label className="text-[10px] font-black text-slate-400 mb-4 block uppercase tracking-widest">Bilangan Pemain Se-pasukan</label>
                                <div className="flex justify-center gap-3 mb-8">
                                    {[2, 3, 4].map(n => (
                                        <button 
                                            key={n} 
                                            onClick={() => setPlayersPerTeam(n)} 
                                            className={`w-14 h-14 rounded-2xl border-2 font-black transition-all ${playersPerTeam === n ? 'border-lime-500 bg-lime-50 text-lime-700' : 'text-slate-300 border-slate-100'}`}
                                        >
                                            {n}
                                        </button>
                                    ))}
                                </div>
                                <button 
                                    onClick={generateEverything} 
                                    className="py-5 bg-lime-400 text-slate-900 rounded-2xl font-black text-xl shadow-xl shadow-lime-100 hover:bg-lime-500 active:scale-95 transition-all uppercase"
                                >
                                    <Icon name="shuffle" className="inline-block mr-2" /> Jana Perlawanan
                                </button>
                            </div>
                        </div>
                    )}

                    {activeTab === 'schedule' && (
                        <div className="grid gap-4 animate-in slide-in-from-bottom-4 duration-300">
                             <div className="flex items-center justify-between px-2">
                                <h2 className="text-xl font-black text-slate-800 uppercase italic">Jadual & Markah</h2>
                                <div className="text-xs bg-slate-900 text-white px-3 py-1 rounded-full font-bold">{schedule.length} Match</div>
                            </div>
                            {schedule.map((m, idx) => (
                                <div key={idx} className={`p-6 bg-white rounded-3xl border-2 transition-all ${scores[idx]?.completed ? 'border-lime-100 shadow-sm' : 'border-slate-100 shadow-sm'}`}>
                                    <div className="flex justify-between text-[10px] font-black text-slate-300 uppercase tracking-widest mb-6">
                                        <span>PERLAWANAN #{idx+1}</span>
                                        {scores[idx]?.completed && <span className="text-lime-500 flex items-center gap-1"><Icon name="check-circle" className="w-3 h-3" /> SELESAI</span>}
                                    </div>
                                    <div className="grid grid-cols-[1fr,auto,1fr] items-center text-center gap-4">
                                        <div className="space-y-3">
                                            <div className="font-black text-sm text-slate-800">PASUKAN {m.home+1}</div>
                                            <div className="flex flex-wrap justify-center gap-1">
                                                {teams[m.home]?.map((p, i) => <span key={i} className="text-[10px] bg-slate-100 px-1.5 py-0.5 rounded font-bold">{p}</span>)}
                                            </div>
                                            <input 
                                                type="number" 
                                                value={scores[idx]?.home || ''} 
                                                onChange={e => updateScore(idx, 'home', e.target.value)} 
                                                placeholder="0" 
                                                className="w-16 mx-auto py-2 bg-slate-50 border border-slate-200 rounded-xl text-center font-black text-xl outline-none focus:border-lime-400" 
                                            />
                                        </div>
                                        
                                        <div className="flex flex-col items-center">
                                            <Icon name="swords" className="w-6 h-6 text-slate-200" />
                                            <span className="text-[8px] font-black text-slate-300 mt-1">VS</span>
                                        </div>

                                        <div className="space-y-3">
                                            <div className="font-black text-sm text-slate-800">PASUKAN {m.away+1}</div>
                                            <div className="flex flex-wrap justify-center gap-1">
                                                {teams[m.away]?.map((p, i) => <span key={i} className="text-[10px] bg-slate-100 px-1.5 py-0.5 rounded font-bold">{p}</span>)}
                                            </div>
                                            <input 
                                                type="number" 
                                                value={scores[idx]?.away || ''} 
                                                onChange={e => updateScore(idx, 'away', e.target.value)} 
                                                placeholder="0" 
                                                className="w-16 mx-auto py-2 bg-slate-50 border border-slate-200 rounded-xl text-center font-black text-xl outline-none focus:border-lime-400" 
                                            />
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {activeTab === 'leaderboard' && (
                        <div className="space-y-10 animate-in slide-in-from-bottom-4 duration-300">
                            <div>
                                <h2 className="text-xl font-black text-slate-800 uppercase italic mb-4 flex items-center gap-2">
                                    <Icon name="layout-grid" className="text-lime-500" /> Ranking Pasukan
                                </h2>
                                <div className="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
                                    <table className="w-full text-left text-sm">
                                        <thead className="bg-slate-50 border-b border-slate-100">
                                            <tr className="text-[10px] font-black text-slate-400 uppercase">
                                                <th className="px-6 py-4">Ked.</th>
                                                <th className="px-6 py-4">Pasukan</th>
                                                <th className="px-6 py-4 text-center">Mata (Win=2)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {stats.teams.map((t, i) => (
                                                <tr key={i} className={`border-b border-slate-50 last:border-0 ${i === 0 ? 'bg-lime-50/20' : ''}`}>
                                                    <td className="px-6 py-4">
                                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center font-black text-xs ${i === 0 ? 'bg-yellow-400 text-white' : 'bg-slate-100 text-slate-400'}`}>
                                                            {i+1}
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-4">
                                                        <div className="font-bold text-slate-800 text-base">Pasukan {t.id}</div>
                                                        <div className="text-[10px] text-slate-400 truncate max-w-[200px]">{t.members.join(', ')}</div>
                                                    </td>
                                                    <td className="px-6 py-4 text-center">
                                                        <span className={`px-4 py-1 rounded-full font-black text-sm ${i === 0 ? 'bg-lime-400 text-slate-900 shadow-md shadow-lime-100' : 'bg-slate-900 text-white'}`}>
                                                            {t.points}
                                                        </span>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            
                            <div>
                                <h2 className="text-xl font-black text-slate-800 uppercase italic mb-4 flex items-center gap-2">
                                    <Icon name="medal" className="text-orange-500" /> Pemain Paling Kuat
                                </h2>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {stats.players.map((p, i) => (
                                        <div key={p.name} className={`p-5 bg-white rounded-3xl border-2 flex justify-between items-center transition-all ${i === 0 ? 'border-orange-200 bg-orange-50/30 scale-105' : 'border-slate-100 shadow-sm'}`}>
                                            <div className="flex items-center gap-3">
                                                <div className={`w-8 h-8 rounded-full flex items-center justify-center font-black text-xs ${i === 0 ? 'bg-orange-500 text-white' : 'bg-slate-100 text-slate-400'}`}>
                                                    {i+1}
                                                </div>
                                                <div>
                                                    <div className="font-black text-slate-800">{p.name}</div>
                                                    <div className="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">{p.wins} Wins</div>
                                                </div>
                                            </div>
                                            <div className="font-black text-lg text-slate-900 bg-white px-3 py-1 rounded-xl border border-slate-100">
                                                {p.points} <span className="text-[8px] text-slate-400">PTS</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
