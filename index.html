<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball Pro-Maker by Pahan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- html2canvas for PNG Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Firebase Compat (v10.7.1) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        
        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyD8FX1Y7ELzZMjSkAJWGtZhjY47DgFXYtY",
            authDomain: "pickleball-ec298.firebaseapp.com",
            projectId: "pickleball-ec298",
            storageBucket: "pickleball-ec298.firebasestorage.app",
            messagingSenderId: "39328471162",
            appId: "1:39328471162:web:c70ee33fd62f1fad01c3c3"
        };
        
        // Inisialisasi Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pickleball-pro-pahan';
        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        const trophyNames = [
            "Piala Merdeka", "Piala Akhir Tahun", "Piala Mingguan", 
            "Cabaran Hujung Minggu", "Pickleball Smash Cup", 
            "Liga Persahabatan", "Piala Juara Kampung", 
            "The Pickleball Masters", "Piala Santai Petang", "Battle of the Paddles"
        ];

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const SessionWinnerSummary = ({ session }) => {
            const getWinner = () => {
                if (!session.scores || !Object.keys(session.scores).length) return null;
                
                const scores = session.scores;
                const schedule = session.schedule || [];
                const format = session.matchFormat || 'team';
                const pStats = {};
                const tStats = {};

                if (format === 'team') {
                    let finalTeams = [];
                    try { finalTeams = typeof session.finalTeams === 'string' ? JSON.parse(session.finalTeams) : session.finalTeams; } catch(e) {}
                    if (!finalTeams || !finalTeams.length) return null;

                    finalTeams.forEach((t, i) => tStats[i] = { name: t.name, points: 0 });
                    Object.entries(scores).forEach(([idx, data]) => {
                        if (!data.completed) return;
                        const m = schedule[idx];
                        if (!m) return;
                        if (data.home > data.away) tStats[m.home].points += 2;
                        else if (data.away > data.home) tStats[m.away].points += 2;
                    });
                    const sortedTeams = Object.values(tStats).sort((a, b) => b.points - a.points);
                    return sortedTeams.length ? { name: sortedTeams[0].name, isTeam: true } : null;
                } else {
                    schedule.forEach(m => {
                        [m.p1, m.p2, m.p3, m.p4].forEach(p => { if(!pStats[p]) pStats[p] = { points: 0 }; });
                    });
                    Object.entries(scores).forEach(([idx, data]) => {
                        if (!data.completed) return;
                        const m = schedule[idx];
                        if (!m) return;
                        if (data.home > data.away) [m.p1, m.p2].forEach(p => pStats[p].points += 2);
                        else if (data.away > data.home) [m.p3, m.p4].forEach(p => pStats[p].points += 2);
                    });
                    const sortedPlayers = Object.entries(pStats).map(([name, s]) => ({ name, ...s })).sort((a, b) => b.points - a.points);
                    return sortedPlayers.length ? { name: sortedPlayers[0].name, isTeam: false } : null;
                }
            };

            const winner = getWinner();
            if (!winner) return <span className="text-[10px] text-slate-400 italic">Belum ada pemenang</span>;

            return (
                <div className="flex items-center gap-1.5 mt-1">
                    <span className="text-yellow-500"><Icon name="crown" className="w-3.5 h-3.5" /></span>
                    <span className="text-[11px] font-black text-slate-700 uppercase tracking-tight truncate max-w-[150px]">
                        Juara: {winner.name}
                    </span>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [sessions, setSessions] = useState([]);
            const [currentSessionId, setCurrentSessionId] = useState(null);
            const [view, setView] = useState('menu');
            const [sessionDate, setSessionDate] = useState(new Date().toISOString().split('T')[0]);
            const [sessionTitle, setSessionTitle] = useState('');
            const [matchFormat, setMatchFormat] = useState('team');
            
            const [startTime, setStartTime] = useState("19:00");
            const [matchDuration, setMatchDuration] = useState(20);
            const [numCourts, setNumCourts] = useState(1);

            const [individualName, setIndividualName] = useState('');
            const [manualTeamName, setManualTeamName] = useState('');
            const [manualMembers, setManualMembers] = useState('');
            
            const [players, setPlayers] = useState([]); 
            const [teams, setTeams] = useState([]); 
            const [finalTeams, setFinalTeams] = useState([]); 
            const [schedule, setSchedule] = useState([]);
            const [scores, setScores] = useState({});
            const [playersPerTeam, setPlayersPerTeam] = useState(2);
            const [isGenerated, setIsGenerated] = useState(false);
            const [activeTab, setActiveTab] = useState('players');
            const [isSaving, setIsSaving] = useState(false);
            const [sessionToDelete, setSessionToDelete] = useState(null);
            const [isExporting, setIsExporting] = useState(false);

            const randomizeTrophy = () => {
                const randomName = trophyNames[Math.floor(Math.random() * trophyNames.length)];
                setSessionTitle(randomName);
            };

            useEffect(() => {
                randomizeTrophy();
                const initAuth = async () => {
                    try {
                        if (initialToken) {
                            try {
                                await auth.signInWithCustomToken(initialToken);
                            } catch (e) {
                                if (e.code === 'auth/custom-token-mismatch' || e.code === 'auth/invalid-custom-token') {
                                    await auth.signInAnonymously();
                                } else { throw e; }
                            }
                        } else { await auth.signInAnonymously(); }
                    } catch (error) { 
                        console.error("Auth Error:", error); 
                        try { await auth.signInAnonymously(); } catch(i) {}
                    }
                };
                initAuth();
                const unsubscribe = auth.onAuthStateChanged((u) => setUser(u));
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const sessionsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions');
                return sessionsRef.onSnapshot((snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setSessions(data.sort((a, b) => new Date(b.date) - new Date(a.date)));
                });
            }, [user]);

            useEffect(() => {
                if (!user || !currentSessionId) return;
                const sessionDoc = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions').doc(currentSessionId);
                return sessionDoc.onSnapshot((snapshot) => {
                    if (snapshot.exists) {
                        const data = snapshot.data();
                        setPlayers(data.players || []);
                        setSessionTitle(data.title || 'Tiada Nama');
                        setMatchFormat(data.matchFormat || 'team');
                        setStartTime(data.startTime || "19:00");
                        setMatchDuration(data.matchDuration || 20);
                        setNumCourts(data.numCourts || 1);
                        
                        let parsedTeams = [];
                        let parsedFinalTeams = [];
                        try {
                            parsedTeams = data.teams ? (typeof data.teams === 'string' ? JSON.parse(data.teams) : data.teams) : [];
                            parsedFinalTeams = data.finalTeams ? (typeof data.finalTeams === 'string' ? JSON.parse(data.finalTeams) : data.finalTeams) : [];
                        } catch (e) { console.error("Parse error", e); }
                        
                        setTeams(parsedTeams);
                        setFinalTeams(parsedFinalTeams);
                        setSchedule(data.schedule || []);
                        setScores(data.scores || {});
                        setPlayersPerTeam(data.playersPerTeam || 2);
                        setIsGenerated(data.isGenerated || false);
                        setSessionDate(data.date);
                    }
                });
            }, [user, currentSessionId]);

            const createNewSession = async () => {
                if (!user) return;
                setIsSaving(true);
                try {
                    const sessionsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions');
                    const newDoc = await sessionsRef.add({
                        title: sessionTitle || "Piala Tanpa Nama",
                        date: sessionDate,
                        matchFormat,
                        startTime,
                        matchDuration,
                        numCourts,
                        players: [],
                        teams: JSON.stringify([]),
                        finalTeams: JSON.stringify([]),
                        schedule: [],
                        scores: {},
                        playersPerTeam: 2,
                        isGenerated: false,
                        createdAt: new Date().toISOString()
                    });
                    setCurrentSessionId(newDoc.id);
                    setView('active');
                    setActiveTab('players');
                } catch (e) { console.error(e); } finally { setIsSaving(false); }
            };

            const deleteSession = async (id) => {
                if (!user) return;
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions').doc(id).delete();
                    setSessionToDelete(null);
                } catch (e) { console.error("Delete Error:", e); }
            };

            const syncToCloud = async (newData) => {
                if (!user || !currentSessionId) return;
                try {
                    const sessionDoc = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions').doc(currentSessionId);
                    await sessionDoc.update(newData);
                } catch (e) { console.error("Update Error:", e); }
            };

            const calculateTime = (idx) => {
                const [h, m] = startTime.split(':').map(Number);
                const totalMinutes = (h * 60) + m + (Math.floor(idx / numCourts) * matchDuration);
                const currentH = Math.floor(totalMinutes / 60) % 24;
                const currentM = totalMinutes % 60;
                const period = currentH >= 12 ? 'PM' : 'AM';
                const displayH = currentH % 12 || 12;
                return `${displayH}:${currentM.toString().padStart(2, '0')} ${period}`;
            };

            const getFinishTime = () => {
                if (schedule.length === 0) return "--";
                return calculateTime(schedule.length);
            };

            const addIndividualPlayer = (e) => {
                e.preventDefault();
                if (!individualName.trim()) return;
                const names = individualName.split(/[\n,]+/).map(n => n.trim()).filter(n => n !== "" && !players.includes(n));
                const updatedPlayers = [...players, ...names];
                setPlayers(updatedPlayers);
                syncToCloud({ players: updatedPlayers });
                setIndividualName('');
            };

            const removeIndividualPlayer = (idx) => {
                const updatedPlayers = players.filter((_, i) => i !== idx);
                setPlayers(updatedPlayers);
                syncToCloud({ players: updatedPlayers });
            };

            const addManualTeam = (e) => {
                e.preventDefault();
                if (!manualTeamName.trim() || !manualMembers.trim()) return;
                const membersArr = manualMembers.split(/[\n,]+/).map(n => n.trim()).filter(n => n !== "");
                const newTeam = { name: manualTeamName.trim(), members: membersArr };
                const updatedTeams = [...teams, newTeam];
                setTeams(updatedTeams);
                syncToCloud({ teams: JSON.stringify(updatedTeams) });
                setManualTeamName('');
                setManualMembers('');
            };

            const removeTeam = (idx) => {
                const updatedTeams = teams.filter((_, i) => i !== idx);
                setTeams(updatedTeams);
                syncToCloud({ teams: JSON.stringify(updatedTeams) });
            };

            const handleStartMatch = () => {
                let finalSchedule = [];
                let finalTeamsList = [];
                if (matchFormat === 'team') {
                    finalTeamsList = [...teams];
                    if (players.length > 0) {
                        const shuffledIndividuals = [...players].sort(() => Math.random() - 0.5);
                        for (let i = 0; i < shuffledIndividuals.length; i += playersPerTeam) {
                            const members = shuffledIndividuals.slice(i, i + playersPerTeam);
                            finalTeamsList.push({ name: `Mix Team ${Math.floor(i/playersPerTeam) + 1}`, members });
                        }
                    }
                    if (finalTeamsList.length < 2) return alert("Perlukan sekurang-kurangnya 2 pasukan.");
                    for (let i = 0; i < finalTeamsList.length; i++) {
                        for (let j = i + 1; j < finalTeamsList.length; j++) {
                            finalSchedule.push({ home: i, away: j });
                        }
                    }
                } else {
                    let allPlayers = [...players];
                    teams.forEach(t => allPlayers.push(...t.members));
                    allPlayers = [...new Set(allPlayers)];
                    if (allPlayers.length < 4) return alert("Perlukan sekurang-kurangnya 4 pemain untuk Scramble.");
                    const rounds = Math.min(allPlayers.length - 1, 6);
                    for (let r = 0; r < rounds; r++) {
                        const shuffled = [...allPlayers].sort(() => Math.random() - 0.5);
                        for (let i = 0; i < shuffled.length - 3; i += 4) {
                            finalSchedule.push({ isScramble: true, p1: shuffled[i], p2: shuffled[i+1], p3: shuffled[i+2], p4: shuffled[i+3] });
                        }
                    }
                }
                syncToCloud({ 
                    finalTeams: JSON.stringify(finalTeamsList), 
                    schedule: finalSchedule, 
                    scores: {}, 
                    isGenerated: true,
                    startTime,
                    matchDuration,
                    numCourts
                });
                setActiveTab('schedule');
            };

            const updateScore = (matchIdx, side, value) => {
                const val = value === '' ? 0 : parseInt(value);
                const newScores = { ...scores, [matchIdx]: { ...scores[matchIdx], [side]: val, completed: true } };
                setScores(newScores);
                syncToCloud({ scores: newScores });
            };

            const stats = useMemo(() => {
                const pStats = {};
                const tStats = [];
                if (matchFormat === 'team') {
                    finalTeams.forEach((t, i) => {
                        tStats.push({ id: i, name: t.name, points: 0, wins: 0, losses: 0, members: t.members });
                        t.members.forEach(p => pStats[p] = { points: 0, wins: 0, losses: 0 });
                    });
                    Object.entries(scores).forEach(([idx, data]) => {
                        if (!data.completed || !schedule[idx]) return;
                        const m = schedule[idx];
                        if (data.home > data.away) {
                            tStats[m.home].points += 2; tStats[m.home].wins += 1;
                            tStats[m.home].members.forEach(p => { if(pStats[p]) { pStats[p].points += 2; pStats[p].wins += 1; } });
                            tStats[m.away].losses += 1;
                            tStats[m.away].members.forEach(p => { if(pStats[p]) pStats[p].losses += 1; });
                        } else if (data.away > data.home) {
                            tStats[m.away].points += 2; tStats[m.away].wins += 1;
                            tStats[m.away].members.forEach(p => { if(pStats[p]) { pStats[p].points += 2; pStats[p].wins += 1; } });
                            tStats[m.home].losses += 1;
                            tStats[m.home].members.forEach(p => { if(pStats[p]) { pStats[p].losses += 1; } });
                        }
                    });
                } else {
                    schedule.forEach(m => { [m.p1, m.p2, m.p3, m.p4].forEach(p => { if(!pStats[p]) pStats[p] = { points: 0, wins: 0, losses: 0 }; }); });
                    Object.entries(scores).forEach(([idx, data]) => {
                        if (!data.completed || !schedule[idx]) return;
                        const m = schedule[idx];
                        if (data.home > data.away) {
                            [m.p1, m.p2].forEach(p => { pStats[p].points += 2; pStats[p].wins += 1; });
                            [m.p3, m.p4].forEach(p => { pStats[p].losses += 1; });
                        } else if (data.away > data.home) {
                            [m.p3, m.p4].forEach(p => { pStats[p].points += 2; pStats[p].wins += 1; });
                            [m.p1, m.p2].forEach(p => { pStats[p].losses += 1; });
                        }
                    });
                }
                return { teams: tStats.sort((a, b) => b.points - a.points), players: Object.entries(pStats).map(([name, s]) => ({ name, ...s })).sort((a, b) => b.points - a.points || a.losses - b.losses) };
            }, [scores, finalTeams, schedule, matchFormat]);

            const downloadPNG = async () => {
                const element = document.getElementById('leaderboard-export');
                if (!element) return;
                setIsExporting(true);
                setTimeout(async () => {
                    const canvas = await html2canvas(element, { scale: 2, backgroundColor: '#ffffff' });
                    const image = canvas.toDataURL("image/png");
                    const link = document.createElement('a');
                    link.download = `Keputusan-${sessionTitle}-${sessionDate}.png`;
                    link.href = image;
                    link.click();
                    setIsExporting(false);
                }, 100);
            };

            if (!user && sessions.length === 0) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 text-slate-400">
                        <Icon name="loader" className="w-10 h-10 animate-spin mb-4" />
                        <p className="font-bold uppercase tracking-widest text-xs text-center">Menyambung ke Pahan Database...</p>
                    </div>
                );
            }

            if (view === 'menu') {
                return (
                    <div className="min-h-screen p-4 md:p-8 max-w-2xl mx-auto animate-in fade-in duration-500">
                        <header className="text-center mb-10">
                            <div className="inline-flex items-center justify-center p-4 bg-lime-400 rounded-3xl mb-4 shadow-xl">
                                <Icon name="trophy" className="w-10 h-10 text-slate-900" />
                            </div>
                            <h1 className="text-4xl font-black tracking-tight text-slate-900">Pickleball Pro-Maker</h1>
                            <p className="text-slate-500 italic mt-1 font-medium tracking-tight">
                                by <a href="https://wa.me/60135792215" target="_blank" className="hover:text-lime-600 underline decoration-dotted transition-colors">Pahan</a>
                            </p>
                        </header>

                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 mb-6">
                            <h2 className="font-bold mb-4 flex items-center gap-2 text-lime-600"><Icon name="plus" /> Sesi Baru</h2>
                            <div className="space-y-4">
                                <div>
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1.5 ml-1">Nama Kejohanan</label>
                                    <div className="flex gap-2">
                                        <input type="text" value={sessionTitle} onChange={e => setSessionTitle(e.target.value)} placeholder="cth: Piala Merdeka..." className="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:ring-2 focus:ring-lime-500" />
                                        <button onClick={randomizeTrophy} className="bg-slate-100 text-slate-500 p-3 rounded-xl hover:bg-slate-200 transition-colors"><Icon name="refresh-cw" /></button>
                                    </div>
                                </div>
                                <div>
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1.5 ml-1">Format Perlawanan</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => setMatchFormat('team')} className={`p-4 rounded-xl border-2 flex flex-col items-center gap-1 transition-all ${matchFormat === 'team' ? 'border-blue-500 bg-blue-50' : 'border-slate-100'}`}>
                                            <Icon name="users" className={matchFormat === 'team' ? 'text-blue-600' : 'text-slate-300'} />
                                            <span className={`text-[10px] font-black uppercase ${matchFormat === 'team' ? 'text-blue-700' : 'text-slate-400'}`}>Pasukan (Official)</span>
                                        </button>
                                        <button onClick={() => setMatchFormat('scramble')} className={`p-4 rounded-xl border-2 flex flex-col items-center gap-1 transition-all ${matchFormat === 'scramble' ? 'border-orange-500 bg-orange-50' : 'border-slate-100'}`}>
                                            <Icon name="refresh-ccw" className={matchFormat === 'scramble' ? 'text-orange-600' : 'text-slate-300'} />
                                            <span className={`text-[10px] font-black uppercase ${matchFormat === 'scramble' ? 'text-orange-700' : 'text-slate-400'}`}>Individu (Scramble)</span>
                                        </button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1.5 ml-1">Tarikh</label>
                                        <input type="date" value={sessionDate} onChange={e => setSessionDate(e.target.value)} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1.5 ml-1">Masa Mula</label>
                                        <input type="time" value={startTime} onChange={e => setStartTime(e.target.value)} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none" />
                                    </div>
                                </div>
                                <button onClick={createNewSession} disabled={isSaving} className="w-full bg-slate-900 text-white px-8 py-4 rounded-2xl font-black text-lg hover:bg-slate-800 transition-all shadow-xl shadow-slate-200 active:scale-95 tracking-tight uppercase italic">
                                    {isSaving ? "Sedang Bina..." : "Mula Sesi Sekarang"}
                                </button>
                            </div>
                        </div>

                        <div className="space-y-3">
                            <h2 className="text-xs font-black text-slate-400 uppercase tracking-widest px-2 flex items-center gap-2">
                                <Icon name="history" className="w-4 h-4" /> Rekod Sesi Terdahulu
                            </h2>
                            {sessions.map(s => (
                                <div key={s.id} className="group relative">
                                    <button onClick={() => { setCurrentSessionId(s.id); setView('active'); }} className="w-full flex items-center justify-between p-5 bg-white rounded-2xl border border-slate-100 hover:border-lime-400 hover:shadow-md transition-all">
                                        <div className="flex items-start gap-4 text-left">
                                            <div className="w-12 h-12 bg-slate-50 rounded-xl flex flex-col items-center justify-center font-black group-hover:bg-lime-50 transition-colors">
                                                <Icon name={s.matchFormat === 'team' ? 'users' : 'user'} className={`w-5 h-5 ${s.matchFormat === 'team' ? 'text-blue-400' : 'text-orange-400'}`} />
                                                <span className="text-[8px] mt-0.5 text-slate-400 font-bold uppercase tracking-tighter">{s.matchFormat === 'team' ? 'Team' : 'Scrmb'}</span>
                                            </div>
                                            <div className="flex-1 overflow-hidden">
                                                <div className="font-bold text-slate-800 line-clamp-1 truncate">{s.title || "Sesi Tanpa Nama"}</div>
                                                <div className="text-[10px] text-slate-400 font-bold uppercase tracking-tight flex items-center gap-2">
                                                    <span className="flex items-center gap-1"><Icon name="calendar" className="w-2.5 h-2.5" /> {new Date(s.date).toLocaleDateString('ms-MY', { month: 'short', day: 'numeric' })}</span>
                                                    <span>•</span>
                                                    <span>{s.isGenerated ? "Selesai" : "Draf"}</span>
                                                </div>
                                                <SessionWinnerSummary session={s} />
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <button onClick={(e) => { e.stopPropagation(); setSessionToDelete(s.id); }} className="p-2 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all"><Icon name="trash-2" /></button>
                                            <Icon name="chevron-right" className="text-slate-300 group-hover:text-lime-500" />
                                        </div>
                                    </button>
                                </div>
                            ))}
                        </div>
                        {sessionToDelete && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl">
                                    <h3 className="text-xl font-black text-slate-900 mb-2">Padam Sesi?</h3>
                                    <div className="flex gap-3">
                                        <button onClick={() => setSessionToDelete(null)} className="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold">Batal</button>
                                        <button onClick={() => deleteSession(sessionToDelete)} className="flex-1 py-3 bg-red-500 text-white rounded-xl font-bold">Padam</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-6xl mx-auto pb-24 animate-in fade-in duration-300">
                    <header className="flex items-center justify-between mb-8">
                        <button onClick={() => setView('menu')} className="flex items-center gap-2 text-slate-500 font-bold hover:text-slate-900 transition-all">
                            <Icon name="chevron-left" /> Menu Utama
                        </button>
                        <div className="text-right">
                            <div className="text-[10px] font-black text-slate-400 uppercase tracking-tighter italic">Format: {matchFormat === 'team' ? 'PASUKAN TETAP' : 'INDIVIDU (SCRAMBLE)'}</div>
                            <div className="font-bold text-slate-900 italic tracking-tight">{sessionTitle}</div>
                            <p className="text-[10px] font-medium text-slate-400">
                                by <a href="https://wa.me/60135792215" target="_blank" className="hover:text-lime-600 underline decoration-dotted">Pahan</a>
                            </p>
                        </div>
                    </header>

                    <nav className="flex bg-white p-1 rounded-xl border border-slate-200 mb-6 sticky top-4 z-10 shadow-sm overflow-x-auto">
                        {[{ id: 'players', label: 'Pendaftaran', icon: 'users' }, { id: 'schedule', label: 'Jadual', icon: 'calendar' }, { id: 'leaderboard', label: 'Kedudukan', icon: 'medal' }].map(tab => (
                            <button key={tab.id} onClick={() => isGenerated || tab.id === 'players' ? setActiveTab(tab.id) : null} className={`flex-1 min-w-[100px] flex items-center justify-center gap-2 py-3 rounded-lg text-sm font-bold capitalize transition-all ${activeTab === tab.id ? 'bg-slate-900 text-white' : 'text-slate-500 hover:bg-slate-50'} ${!isGenerated && tab.id !== 'players' ? 'opacity-30 cursor-not-allowed' : ''}`}>
                                <Icon name={tab.icon} className="w-4 h-4" /> {tab.label}
                            </button>
                        ))}
                    </nav>

                    {activeTab === 'players' && (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <div className="space-y-6">
                                {matchFormat === 'team' && (
                                    <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                        <h2 className="font-bold mb-4 flex items-center gap-2 text-orange-600 uppercase tracking-tight italic text-sm"><Icon name="user-plus" /> Daftar Pasukan Tetap</h2>
                                        <form onSubmit={addManualTeam} className="space-y-3">
                                            <input type="text" value={manualTeamName} onChange={e => setManualTeamName(e.target.value)} placeholder="Nama Pasukan" className="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 font-bold outline-none" />
                                            <textarea value={manualMembers} onChange={e => setManualMembers(e.target.value)} placeholder="Nama Ahli (asingkan dengan koma)" className="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 font-medium h-20 outline-none" />
                                            <button className="w-full bg-orange-500 text-white py-3 rounded-xl font-bold">Tambah Pasukan</button>
                                        </form>
                                    </div>
                                )}
                                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                    <h2 className="font-bold mb-4 flex items-center gap-2 text-lime-600 uppercase tracking-tight italic text-sm"><Icon name="user" /> Daftar Pemain Individu ({players.length})</h2>
                                    <form onSubmit={addIndividualPlayer} className="flex gap-2 mb-4">
                                        <input type="text" value={individualName} onChange={e => setIndividualName(e.target.value)} placeholder="Nama pemain..." className="flex-1 px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 outline-none" />
                                        <button className="bg-slate-900 text-white px-5 rounded-xl"><Icon name="plus" /></button>
                                    </form>
                                    <div className="max-h-[200px] overflow-y-auto custom-scrollbar space-y-1">
                                        {players.map((p, i) => (
                                            <div key={i} className="flex justify-between items-center px-3 py-2 bg-slate-50 rounded-lg text-sm font-bold">
                                                <span>{i + 1}. {p}</span>
                                                <button onClick={() => removeIndividualPlayer(i)} className="text-slate-300 hover:text-red-500 transition-all"><Icon name="trash-2" className="w-3 h-3" /></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                    <h2 className="font-bold mb-4 flex items-center gap-2 text-slate-700 uppercase tracking-tight italic text-sm"><Icon name="clock" /> Anggaran Masa Perlawanan</h2>
                                    <div className="grid grid-cols-2 gap-4 mb-4">
                                        <div>
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Mula</label>
                                            <input type="time" value={startTime} onChange={e => { setStartTime(e.target.value); syncToCloud({ startTime: e.target.value }); }} className="w-full px-3 py-2 bg-slate-50 rounded-lg font-bold border border-slate-100" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Gelanggang</label>
                                            <select value={numCourts} onChange={e => { setNumCourts(parseInt(e.target.value)); syncToCloud({ numCourts: parseInt(e.target.value) }); }} className="w-full px-3 py-2 bg-slate-50 rounded-lg font-bold border border-slate-100">
                                                {[1, 2, 3, 4].map(n => <option key={n} value={n}>{n} Gelanggang</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="mb-6">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Durasi/Game (min)</label>
                                        <input type="number" value={matchDuration} onChange={e => { setMatchDuration(parseInt(e.target.value)); syncToCloud({ matchDuration: parseInt(e.target.value) }); }} className="w-full px-3 py-2 bg-slate-50 rounded-lg font-bold border border-slate-100" />
                                    </div>
                                    <button onClick={handleStartMatch} className="w-full py-5 bg-slate-900 text-white rounded-2xl font-black text-lg shadow-xl uppercase italic tracking-tight active:scale-95 transition-all">
                                        Jana Jadual {matchFormat === 'team' ? 'Liga' : 'Scramble'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'schedule' && (
                        <div className="space-y-6 animate-in slide-in-from-bottom-4 duration-300">
                            <div className="bg-slate-900 text-white p-6 rounded-3xl shadow-xl flex flex-col sm:flex-row justify-between items-center gap-4">
                                <div>
                                    <h2 className="text-sm font-black text-slate-400 uppercase tracking-widest mb-1">Anggaran Selesai</h2>
                                    <div className="text-3xl font-black italic">{getFinishTime()}</div>
                                </div>
                                <div className="text-right flex flex-col items-center sm:items-end">
                                    <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Ringkasan</div>
                                    <div className="flex gap-4">
                                        <div className="bg-slate-800 px-4 py-2 rounded-xl text-center">
                                            <div className="text-xs font-black">{schedule.length}</div>
                                            <div className="text-[8px] text-slate-500 uppercase font-black">Match</div>
                                        </div>
                                        <div className="bg-slate-800 px-4 py-2 rounded-xl text-center">
                                            <div className="text-xs font-black">{numCourts}</div>
                                            <div className="text-[8px] text-slate-500 uppercase font-black">Courts</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="grid gap-4">
                                {schedule.map((m, idx) => (
                                    <div key={idx} className={`p-6 bg-white rounded-3xl border-2 transition-all ${scores[idx]?.completed ? 'border-lime-100 bg-lime-50/10' : 'border-slate-100 shadow-sm'}`}>
                                        <div className="flex justify-between items-center mb-4">
                                            <div className="flex items-center gap-2">
                                                <span className="text-[8px] font-black bg-slate-100 text-slate-400 px-2 py-1 rounded-full uppercase tracking-widest">Match #{idx+1}</span>
                                                <span className="text-[10px] font-black text-blue-500 flex items-center gap-1">
                                                    <Icon name="clock" className="w-3 h-3" /> {calculateTime(idx)}
                                                </span>
                                            </div>
                                            {scores[idx]?.completed && <span className="text-[8px] font-black text-lime-500 bg-lime-100 px-2 py-1 rounded-full uppercase">SELESAI</span>}
                                        </div>
                                        <div className="grid grid-cols-[1fr,auto,1fr] items-center gap-4 text-center">
                                            <div className="space-y-2">
                                                <div className="font-black text-sm text-slate-800 uppercase line-clamp-2 min-h-[40px] flex items-center justify-center">
                                                    {m.isScramble ? `${m.p1} & ${m.p2}` : finalTeams[m.home]?.name}
                                                </div>
                                                <input type="number" value={scores[idx]?.home || ''} onChange={e => updateScore(idx, 'home', e.target.value)} placeholder="0" className="w-16 mx-auto py-2 bg-slate-50 border rounded-xl text-center font-black text-xl outline-none" />
                                            </div>
                                            <div className="flex flex-col items-center">
                                                <Icon name="swords" className="w-5 h-5 text-slate-200" />
                                                <span className="text-[8px] font-black text-slate-300 mt-1 uppercase">Vs</span>
                                            </div>
                                            <div className="space-y-2">
                                                <div className="font-black text-sm text-slate-800 uppercase line-clamp-2 min-h-[40px] flex items-center justify-center">
                                                    {m.isScramble ? `${m.p3} & ${m.p4}` : finalTeams[m.away]?.name}
                                                </div>
                                                <input type="number" value={scores[idx]?.away || ''} onChange={e => updateScore(idx, 'away', e.target.value)} placeholder="0" className="w-16 mx-auto py-2 bg-slate-50 border rounded-xl text-center font-black text-xl outline-none" />
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {activeTab === 'leaderboard' && (
                        <div className="space-y-6 animate-in slide-in-from-bottom-4 duration-300">
                            <div className="flex justify-end">
                                <button onClick={downloadPNG} disabled={isExporting} className="bg-lime-500 text-slate-900 px-6 py-3 rounded-2xl font-black text-sm flex items-center gap-2 hover:bg-lime-400 transition-all shadow-lg shadow-lime-100">
                                    <Icon name="download" /> {isExporting ? "Menjana Imej..." : "Muat Turun Keputusan (PNG)"}
                                </button>
                            </div>

                            <div id="leaderboard-export" className="bg-white rounded-[32px] border border-slate-200 overflow-hidden shadow-sm p-4 sm:p-8">
                                <div className="text-center mb-10">
                                    <div className="inline-flex items-center justify-center p-3 bg-lime-400 rounded-2xl mb-4">
                                        <Icon name="medal" className="w-8 h-8 text-slate-900" />
                                    </div>
                                    <h2 className="text-3xl font-black text-slate-900 uppercase italic tracking-tight">{sessionTitle}</h2>
                                    <p className="text-slate-400 font-bold tracking-widest text-[10px] uppercase mt-1">{new Date(sessionDate).toLocaleDateString('ms-MY', { day: 'numeric', month: 'long', year: 'numeric' })} • Format {matchFormat === 'scramble' ? 'Individu (Scramble)' : 'Pasukan'}</p>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full text-left">
                                        <thead>
                                            <tr className="text-[10px] font-black text-slate-400 uppercase border-b border-slate-100">
                                                <th className="px-6 py-4">Pos</th>
                                                <th className="px-6 py-4">Pemain</th>
                                                <th className="px-6 py-4 text-center">Menang</th>
                                                <th className="px-6 py-4 text-center">Kalah</th>
                                                <th className="px-6 py-4 text-center">Mata</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {stats.players.map((p, i) => (
                                                <tr key={i} className={`border-b border-slate-50 last:border-0 transition-colors ${i === 0 ? 'bg-yellow-50/50' : ''}`}>
                                                    <td className="px-6 py-5">
                                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center font-black text-xs ${i === 0 ? 'bg-yellow-400 text-white shadow-lg shadow-yellow-200' : i === 1 ? 'bg-slate-200 text-slate-500' : i === 2 ? 'bg-orange-100 text-orange-600' : 'bg-slate-50 text-slate-400'}`}>
                                                            {i === 0 ? <Icon name="crown" className="w-4 h-4" /> : i+1}
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-5">
                                                        <div className="flex items-center gap-2">
                                                            <span className={`font-black uppercase tracking-tight text-sm ${i === 0 ? 'text-yellow-700' : 'text-slate-700'}`}>{p.name}</span>
                                                            {i === 0 && <span className="text-yellow-500 animate-pulse text-lg">🌟</span>}
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-5 text-center">
                                                        <span className="bg-lime-100 text-lime-700 px-3 py-1 rounded-full text-[10px] font-black">{p.wins}W</span>
                                                    </td>
                                                    <td className="px-6 py-5 text-center">
                                                        <span className="bg-red-50 text-red-400 px-3 py-1 rounded-full text-[10px] font-black">{p.losses}L</span>
                                                    </td>
                                                    <td className="px-6 py-5 text-center font-black text-lg text-slate-900">
                                                        {p.points}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="mt-12 grid grid-cols-3 gap-4 border-t border-slate-100 pt-8">
                                    {stats.players.slice(0, 3).map((p, i) => (
                                        <div key={i} className="text-center p-4 rounded-3xl bg-slate-50 border border-slate-100">
                                            <div className="text-[10px] font-black text-slate-400 uppercase mb-1">{i === 0 ? 'Juara' : i === 1 ? 'Naib Juara' : 'Ketiga'}</div>
                                            <div className={`font-black uppercase text-sm ${i === 0 ? 'text-yellow-600' : 'text-slate-700'}`}>{p.name}</div>
                                        </div>
                                    ))}
                                </div>
                                <div className="text-center mt-8 text-[8px] font-bold text-slate-300 uppercase tracking-widest italic">
                                    Pickleball Pro-Maker by <a href="https://wa.me/60135792215" target="_blank" className="underline decoration-dotted">Pahan</a>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
