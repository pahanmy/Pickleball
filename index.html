        const trophyNames = [
            "Piala Merdeka", "Piala Akhir Tahun", "Piala Mingguan", 
            "Cabaran Hujung Minggu", "Pickleball Smash Cup", 
            "Liga Persahabatan", "Piala Juara Kampung", 
            "The Pickleball Masters", "Piala Santai Petang", "Battle of the Paddles"
        ];

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const SessionWinnerSummary = ({ session, t }) => {
            const winner = useMemo(() => {
                if (!session || !session.scores || !Object.keys(session.scores).length) return null;
                const scores = session.scores;
                const schedule = session.schedule || [];
                const format = session.matchFormat || 'team';
                const pStats = {};
                const tStats = {};

                try {
                    if (format === 'team') {
                        let fTeams = [];
                        try { fTeams = typeof session.finalTeams === 'string' ? JSON.parse(session.finalTeams) : (session.finalTeams || []); } catch(e) { fTeams = []; }
                        if (!Array.isArray(fTeams) || fTeams.length === 0) return null;
                        fTeams.forEach((team, i) => { tStats[i] = { name: (team && team.name) ? team.name : 'Team '+(i+1), points: 0 }; });
                        Object.entries(scores).forEach(([idx, data]) => {
                            if (!data || !data.confirmed) return; 
                            const m = schedule[idx];
                            if (!m || tStats[m.home] === undefined || tStats[m.away] === undefined) return;
                            if (data.home > data.away) tStats[m.home].points += 2;
                            else if (data.away > data.home) tStats[m.away].points += 2;
                        });
                        const sortedTeams = Object.values(tStats).sort((a, b) => b.points - a.points);
                        return (sortedTeams.length > 0 && sortedTeams[0].points > 0) ? { name: sortedTeams[0].name } : null;
                    } else {
                        if (!Array.isArray(schedule)) return null;
                        schedule.forEach(m => {
                            if (m && m.p1) [m.p1, m.p2, m.p3, m.p4].forEach(p => { if(p && !pStats[p]) pStats[p] = { points: 0 }; });
                        });
                        Object.entries(scores).forEach(([idx, data]) => {
                            if (!data || !data.confirmed) return; 
                            const m = schedule[idx];
                            if (!m) return;
                            if (data.home > data.away) {
                                if (m.p1 && pStats[m.p1]) pStats[m.p1].points += 2;
                                if (m.p2 && pStats[m.p2]) pStats[m.p2].points += 2;
                            } else if (data.away > data.home) {
                                if (m.p3 && pStats[m.p3]) pStats[m.p3].points += 2;
                                if (m.p4 && pStats[m.p4]) pStats[m.p4].points += 2;
                            }
                        });
                        const sortedPlayers = Object.entries(pStats).map(([name, s]) => ({ name, points: s.points })).sort((a, b) => b.points - a.points);
                        return (sortedPlayers.length > 0 && sortedPlayers[0].points > 0) ? { name: sortedPlayers[0].name } : null;
                    }
                } catch (err) { return null; }
            }, [session]);

            if (!winner) return <span className="text-[10px] text-slate-400 italic">{t.waiting}</span>;
            return (
                <div className="flex items-center gap-1.5 mt-1">
                    <span className="text-yellow-500"><Icon name="crown" className="w-3.5 h-3.5" /></span>
                    <span className="text-[11px] font-black text-slate-700 uppercase tracking-tight truncate max-w-[150px]">
                        {t.winner}: {winner.name}
                    </span>
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('bm');
            const t = i18n[lang];

            const [user, setUser] = useState(null);
            const [sessions, setSessions] = useState([]);
            const [currentSessionId, setCurrentSessionId] = useState(null);
            const [view, setView] = useState('menu');
            const [sessionDate, setSessionDate] = useState(new Date().toISOString().split('T')[0]);
            const [sessionTitle, setSessionTitle] = useState('');
            const [sessionLocation, setSessionLocation] = useState('Paragon Pickleball Center Miri');
            const [matchFormat, setMatchFormat] = useState('team');
            
            const [historyFilterDate, setHistoryFilterDate] = useState('');
            const [startTime, setStartTime] = useState("19:00");
            const [matchDuration, setMatchDuration] = useState(20);
            const [numCourts, setNumCourts] = useState(1);

            const [individualName, setIndividualName] = useState('');
            const [manualTeamName, setManualTeamName] = useState('');
            const [manualMembers, setManualMembers] = useState('');
            
            const [players, setPlayers] = useState([]); 
            const [teams, setTeams] = useState([]); 
            const [finalTeams, setFinalTeams] = useState([]); 
            const [schedule, setSchedule] = useState([]);
            const [scores, setScores] = useState({});
            const [playersPerTeam, setPlayersPerTeam] = useState(2);
            const [isGenerated, setIsGenerated] = useState(false);
            const [activeTab, setActiveTab] = useState('players');
            const [isSaving, setIsSaving] = useState(false);
            const [sessionToDelete, setSessionToDelete] = useState(null);
            const [isExporting, setIsExporting] = useState(false);

            const randomizeTrophy = () => {
                const randomName = trophyNames[Math.floor(Math.random() * trophyNames.length)];
                setSessionTitle(randomName);
            };

            const resetSessionData = () => {
                setPlayers([]);
                setTeams([]);
                setFinalTeams([]);
                setSchedule([]);
                setScores({});
                setIsGenerated(false);
                setActiveTab('players');
            };

            useEffect(() => {
                randomizeTrophy();
                const initAuth = async () => {
                    try {
                        if (initialToken) {
                            try { await auth.signInWithCustomToken(initialToken); } 
                            catch (e) { await auth.signInAnonymously(); }
                        } else { await auth.signInAnonymously(); }
                    } catch (error) { 
                        try { await auth.signInAnonymously(); } catch(i) {}
                    }
                };
                initAuth();
                const unsubscribe = auth.onAuthStateChanged((u) => setUser(u));
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const sessionsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions');
                return sessionsRef.onSnapshot((snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setSessions(data.sort((a, b) => new Date(b.date) - new Date(a.date)));
                });
            }, [user]);

            const globalStats = useMemo(() => {
                let totalMatches = 0;
                const uniquePlayers = new Set();
                sessions.forEach(s => {
                    if (s.schedule && Array.isArray(s.schedule)) totalMatches += s.schedule.length;
                    if (s.players && Array.isArray(s.players)) {
                        s.players.forEach(p => { if(p) uniquePlayers.add(p.trim().toLowerCase()); });
                    }
                    let teamsArr = [];
                    try { 
                        teamsArr = typeof s.teams === 'string' ? JSON.parse(s.teams) : (s.teams || []); 
                    } catch(e) { teamsArr = []; }
                    if (Array.isArray(teamsArr)) {
                        teamsArr.forEach(tm => {
                            if (tm && tm.members && Array.isArray(tm.members)) {
                                tm.members.forEach(m => { if(m) uniquePlayers.add(m.trim().toLowerCase()); });
                            }
                        });
                    }
                });
                return { totalMatches, totalPlayers: uniquePlayers.size };
            }, [sessions]);

            const displayedSessions = useMemo(() => {
                let list = [...sessions];
                if (historyFilterDate) return list.filter(s => s.date === historyFilterDate);
                return list.slice(0, 10);
            }, [sessions, historyFilterDate]);

            useEffect(() => {
                if (!user || !currentSessionId) return;
                const sessionDoc = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions').doc(currentSessionId);
                return sessionDoc.onSnapshot((snapshot) => {
                    if (snapshot.exists) {
                        const data = snapshot.data();
                        setPlayers(data.players || []);
                        setSessionTitle(data.title || '');
                        setSessionLocation(data.location || 'Paragon Pickleball Center Miri');
                        setMatchFormat(data.matchFormat || 'team');
                        setStartTime(data.startTime || "19:00");
                        setMatchDuration(data.matchDuration || 20);
                        setNumCourts(data.numCourts || 1);
                        
                        let parsedTeams = [];
                        let parsedFinalTeams = [];
                        try {
                            parsedTeams = data.teams ? (typeof data.teams === 'string' ? JSON.parse(data.teams) : data.teams) : [];
                            parsedFinalTeams = data.finalTeams ? (typeof data.finalTeams === 'string' ? JSON.parse(data.finalTeams) : data.finalTeams) : [];
                        } catch (e) { parsedTeams = []; parsedFinalTeams = []; }
                        
                        setTeams(parsedTeams);
                        setFinalTeams(parsedFinalTeams);
                        setSchedule(data.schedule || []);
                        setScores(data.scores || {});
                        setPlayersPerTeam(data.playersPerTeam || 2);
                        setIsGenerated(data.isGenerated || false);
                        setSessionDate(data.date);
                    }
                });
            }, [user, currentSessionId]);

            // Logic Functions
            const syncToCloud = async (newData) => {
                if (!user || !currentSessionId) return;
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions').doc(currentSessionId).update(newData);
                } catch (e) { console.error("Sync Error", e); }
            };

            const createNewSession = async () => {
                if (!user) return;
                setIsSaving(true);
                try {
                    const newDoc = await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions').add({
                        title: sessionTitle || "Piala Tanpa Nama",
                        location: sessionLocation || "Paragon Pickleball Center Miri",
                        date: sessionDate,
                        matchFormat,
                        startTime,
                        matchDuration,
                        numCourts,
                        players: [],
                        teams: [],
                        finalTeams: [],
                        schedule: [],
                        scores: {},
                        playersPerTeam: 2,
                        isGenerated: false,
                        createdAt: new Date().toISOString()
                    });
                    setCurrentSessionId(newDoc.id);
                    setView('active');
                } catch (e) { console.error("Create Error", e); } finally { setIsSaving(false); }
            };

            const deleteSession = async (id) => {
                if (!user) return;
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions').doc(id).delete();
                    setSessionToDelete(null);
                } catch (e) { console.error("Delete Error:", e); }
            };

            const addIndividualPlayer = (e) => {
                e.preventDefault();
                if (!individualName.trim()) return;
                const names = individualName.split(/[\n,]+/).map(n => n.trim()).filter(n => n !== "" && !players.includes(n));
                const updatedPlayers = [...players, ...names];
                setPlayers(updatedPlayers);
                syncToCloud({ players: updatedPlayers });
                setIndividualName('');
            };

            const removeIndividualPlayer = (idx) => {
                const updatedPlayers = players.filter((_, i) => i !== idx);
                setPlayers(updatedPlayers);
                syncToCloud({ players: updatedPlayers });
            };

            const addManualTeam = (e) => {
                e.preventDefault();
                if (!manualTeamName.trim() || !manualMembers.trim()) return;
                const membersArr = manualMembers.split(/[\n,]+/).map(n => n.trim()).filter(n => n !== "");
                const newTeam = { name: manualTeamName.trim(), members: membersArr };
                const updatedTeams = [...teams, newTeam];
                setTeams(updatedTeams);
                syncToCloud({ teams: updatedTeams });
                setManualTeamName('');
                setManualMembers('');
            };

            const removeTeam = (idx) => {
                const updatedTeams = teams.filter((_, i) => i !== idx);
                setTeams(updatedTeams);
                syncToCloud({ teams: updatedTeams });
            };

            const calculateTime = (idx) => {
                try {
                    const timeStr = startTime || "19:00";
                    if (!timeStr.includes(':')) return "--:--";
                    const [h, m] = timeStr.split(':').map(Number);
                    const totalMinutes = (h * 60) + m + (Math.floor(idx / (numCourts || 1)) * (matchDuration || 20));
                    const currentH = Math.floor(totalMinutes / 60) % 24;
                    const currentM = totalMinutes % 60;
                    return `${currentH % 12 || 12}:${currentM.toString().padStart(2, '0')} ${currentH >= 12 ? 'PM' : 'AM'}`;
                } catch(e) { return "--:--" }
            };

            const getFinishTime = () => {
                if (!schedule || schedule.length === 0) return "--";
                return calculateTime(schedule.length);
            };

            const handleStartMatch = () => {
                let finalSchedule = [];
                let finalTeamsList = [];

                if (matchFormat === 'team') {
                    finalTeamsList = [...teams];
                    if (players.length > 0) {
                        const shuffledIndv = [...players].sort(() => Math.random() - 0.5);
                        for (let i = 0; i < shuffledIndv.length; i += 2) {
                            const pair = shuffledIndv.slice(i, i + 2);
                            if (pair.length > 0) {
                                finalTeamsList.push({
                                    name: `${t.mixTeamPrefix} ${Math.floor(i / 2) + 1}`,
                                    members: pair
                                });
                            }
                        }
                    }
                    if (finalTeamsList.length < 2) return alert(lang === 'bm' ? "Min. 2 pasukan diperlukan." : "Min. 2 teams required.");
                    for (let i = 0; i < finalTeamsList.length; i++) {
                        for (let j = i + 1; j < finalTeamsList.length; j++) {
                            finalSchedule.push({ home: i, away: j });
                        }
                    }
                } else {
                    let allPlayers = [...players];
                    teams.forEach(t => { if(t && t.members) allPlayers.push(...t.members); });
                    allPlayers = [...new Set(allPlayers)];
                    if (allPlayers.length < 4) return alert(lang === 'bm' ? "Min. 4 pemain diperlukan." : "Min. 4 players required.");
                    const rounds = Math.min(allPlayers.length - 1, 6);
                    for (let r = 0; r < rounds; r++) {
                        const shuffled = [...allPlayers].sort(() => Math.random() - 0.5);
                        for (let i = 0; i < shuffled.length - 3; i += 4) {
                            finalSchedule.push({ isScramble: true, p1: shuffled[i], p2: shuffled[i+1], p3: shuffled[i+2], p4: shuffled[i+3] });
                        }
                    }
                }
                syncToCloud({ 
                    finalTeams: JSON.stringify(finalTeamsList), 
                    schedule: finalSchedule, 
                    scores: {}, 
                    isGenerated: true,
                    startTime,
                    matchDuration,
                    numCourts
                });
                setActiveTab('schedule');
            };

            const updateScore = (matchIdx, side, value) => {
                if (scores[matchIdx]?.confirmed) return; 
                const val = value === '' ? 0 : parseInt(value);
                const newScores = { ...scores, [matchIdx]: { ...scores[matchIdx], [side]: val, completed: true } };
                setScores(newScores);
                syncToCloud({ scores: newScores });
            };

            const toggleConfirmScore = (matchIdx) => {
                const currentStatus = scores[matchIdx]?.confirmed || false;
                const newScores = { ...scores, [matchIdx]: { ...scores[matchIdx], confirmed: !currentStatus } };
                setScores(newScores);
                syncToCloud({ scores: newScores });
            };

            const stats = useMemo(() => {
                const pStats = {};
                const tStats = [];
                try {
                    if (matchFormat === 'team') {
                        if (Array.isArray(finalTeams)) {
                            finalTeams.forEach((t, i) => {
                                if (!t) return;
                                tStats.push({ id: i, name: t.name || 'Team '+(i+1), points: 0, wins: 0, losses: 0, members: Array.isArray(t.members) ? t.members : [] });
                                if(Array.isArray(t.members)) {
                                    t.members.forEach(p => { if(p) pStats[p] = { points: 0, wins: 0, losses: 0 }; });
                                }
                            });
                            Object.entries(scores).forEach(([idx, data]) => {
                                if (!data || !data.completed || !data.confirmed || !schedule[idx]) return; 
                                const m = schedule[idx];
                                if (m && tStats[m.home] && tStats[m.away]) {
                                    if (data.home > data.away) {
                                        tStats[m.home].points += 2; tStats[m.home].wins += 1;
                                        if(Array.isArray(tStats[m.home].members)) {
                                            tStats[m.home].members.forEach(p => { if(pStats[p]) { pStats[p].points += 2; pStats[p].wins += 1; } });
                                        }
                                        tStats[m.away].losses += 1;
                                        if(Array.isArray(tStats[m.away].members)) {
                                            tStats[m.away].members.forEach(p => { if(pStats[p]) { pStats[p].losses += 1; } });
                                        }
                                    } else if (data.away > data.home) {
                                        tStats[m.away].points += 2; tStats[m.away].wins += 1;
                                        if(Array.isArray(tStats[m.away].members)) {
                                            tStats[m.away].members.forEach(p => { if(pStats[p]) { pStats[p].points += 2; pStats[p].wins += 1; } });
                                        }
                                        tStats[m.home].losses += 1;
                                        if(Array.isArray(tStats[m.home].members)) {
                                            tStats[m.home].members.forEach(p => { if(pStats[p]) { pStats[p].losses += 1; } });
                                        }
                                    }
                                }
                            });
                        }
                    } else if (Array.isArray(schedule)) {
                        schedule.forEach(m => { 
                            if(m && m.isScramble) [m.p1, m.p2, m.p3, m.p4].forEach(p => { if(p && !pStats[p]) pStats[p] = { points: 0, wins: 0, losses: 0 }; }); 
                        });
                        Object.entries(scores).forEach(([idx, data]) => {
                            if (!data || !data.completed || !data.confirmed || !schedule[idx]) return; 
                            const m = schedule[idx];
                            if (m && data.home > data.away) {
                                if(m.p1 && pStats[m.p1]) { pStats[m.p1].points += 2; pStats[m.p1].wins += 1; }
                                if(m.p2 && pStats[m.p2]) { pStats[m.p2].points += 2; pStats[m.p2].wins += 1; }

                            } else if (m && data.away > data.home) {

                                if(m.p2 && pStats[m.p2]) { pStats[m.p2].losses += 1; }
                            }
                        });
                    }
                } catch(e) {}
                
                const sortedPlayers = Object.entries(pStats).map(([name, s]) => ({ name, ...s })).sort((a, b) => b.points - a.points || a.losses - b.losses);
                const sortedTeams = tStats.sort((a, b) => b.points - a.points || a.losses - b.losses);

                        </div>
                    )}

                    {activeTab === 'leaderboard' && (
                        <div className="space-y-6 animate-in slide-in-from-bottom-4 duration-300">
                            <div className="bg-orange-50 border border-orange-100 p-4 rounded-2xl flex items-center gap-3"><Icon name="info" className="text-orange-600" /><div className="text-[11px] font-bold text-orange-800">{t.leaderboardNote}</div></div>
                            <div className="flex justify-end"><button onClick={downloadPNG} disabled={isExporting} className="bg-lime-500 text-slate-900 px-6 py-3 rounded-2xl font-black text-xs flex items-center gap-2 hover:bg-lime-400 shadow-lg shadow-lime-100 uppercase italic tracking-tight"><Icon name="download" /> {isExporting ? "..." : t.downloadPNG}</button></div>
                            <div id="leaderboard-export" className="bg-white rounded-[32px] border border-slate-200 shadow-sm p-4 sm:p-8">
                                <div className="text-center mb-10"><div className="inline-flex items-center justify-center p-3 bg-lime-400 rounded-2xl mb-4"><Icon name="medal" className="w-8 h-8 text-slate-900" /></div><h2 className="text-3xl font-black text-slate-900 uppercase italic tracking-tight">{sessionTitle}</h2><div className="text-slate-500 font-bold flex items-center justify-center gap-2 mt-1"><Icon name="map-pin" className="w-4 h-4 text-slate-400" /> {sessionLocation}</div><p className="text-slate-400 font-bold tracking-widest text-[10px] uppercase mt-1">{new Date(sessionDate).toLocaleDateString('ms-MY', { day: 'numeric', month: 'long', year: 'numeric' })} • Format {matchFormat === 'scramble' ? 'Scramble' : 'Team'}</p></div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left">
                                        <thead>
                                            <tr className="text-[10px] font-black text-slate-400 uppercase border-b border-slate-100">
                                                <th className="px-6 py-4">Pos</th>
                                                <th className="px-6 py-4">{matchFormat === 'team' ? t.teamName : (lang === 'bm' ? 'Pemain' : 'Player')}</th>
                                                <th className="px-6 py-4 text-center">{t.win}</th>
                                                <th className="px-6 py-4 text-center">{t.lost}</th>
                                                <th className="px-6 py-4 text-center">{t.pts}</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {matchFormat === 'team' ? (
                                                stats.teams && stats.teams.length > 0 ? stats.teams.map((team, i) => (
                                                    <tr key={i} className={`border-b border-slate-50 last:border-0 transition-colors ${i === 0 ? 'bg-yellow-50/50' : ''}`}>
                                                        <td className="px-6 py-5">
                                                            <div className={`w-8 h-8 rounded-full flex items-center justify-center font-black text-xs ${i === 0 ? 'bg-yellow-400 text-white shadow-lg shadow-yellow-200' : i === 1 ? 'bg-slate-200 text-slate-500' : i === 2 ? 'bg-orange-100 text-orange-600' : 'bg-slate-50 text-slate-400'}`}>
                                                                {i === 0 ? <Icon name="crown" className="w-4 h-4" /> : i+1}
                                                            </div>
                                                        </td>
                                                        <td className="px-6 py-5">
                                                            <div>
                                                                <div className={`font-black uppercase tracking-tight text-sm ${i === 0 ? 'text-yellow-700' : 'text-slate-700'}`}>{team.name} {i === 0 && '🌟'}</div>
                                                                <div className="text-[10px] text-slate-400 font-bold italic">{team.members && team.members.join(' & ')}</div>
                                                            </div>
                                                        </td>
                                                        <td className="px-6 py-5 text-center"><span className="bg-lime-100 text-lime-700 px-3 py-1 rounded-full text-[10px] font-black">{team.wins}W</span></td>
                                                        <td className="px-6 py-5 text-center"><span className="bg-red-50 text-red-400 px-3 py-1 rounded-full text-[10px] font-black">{team.losses}L</span></td>
                                                        <td className="px-6 py-5 text-center font-black text-lg text-slate-900">{team.points}</td>
                                                    </tr>
                                                )) : (<tr><td colSpan="5" className="text-center py-10 text-slate-400 italic">No rankings yet / Tiada kedudukan lagi</td></tr>)
                                            ) : (
                                                stats.players && stats.players.length > 0 ? stats.players.map((p, i) => (
                                                    <tr key={i} className={`border-b border-slate-50 last:border-0 transition-colors ${i === 0 ? 'bg-yellow-50/50' : ''}`}>
                                                        <td className="px-6 py-5"><div className={`w-8 h-8 rounded-full flex items-center justify-center font-black text-xs ${i === 0 ? 'bg-yellow-400 text-white shadow-lg shadow-yellow-200' : i === 1 ? 'bg-slate-200 text-slate-500' : i === 2 ? 'bg-orange-100 text-orange-600' : 'bg-slate-50 text-slate-400'}`}>{i === 0 ? <Icon name="crown" className="w-4 h-4" /> : i+1}</div></td>
                                                        <td className="px-6 py-5"><span className={`font-black uppercase tracking-tight text-sm ${i === 0 ? 'text-yellow-700' : 'text-slate-700'}`}>{p.name} {i === 0 && '🌟'}</span></td>
                                                        <td className="px-6 py-5 text-center"><span className="bg-lime-100 text-lime-700 px-3 py-1 rounded-full text-[10px] font-black">{p.wins}W</span></td>
                                                        <td className="px-6 py-5 text-center"><span className="bg-red-50 text-red-400 px-3 py-1 rounded-full text-[10px] font-black">{p.losses}L</span></td>
                                                        <td className="px-6 py-5 text-center font-black text-lg text-slate-900">{p.points}</td>
                                                    </tr>
                                                )) : (<tr><td colSpan="5" className="text-center py-10 text-slate-400 italic">No rankings yet / Tiada kedudukan lagi</td></tr>)
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="mt-12 grid grid-cols-3 gap-4 border-t border-slate-100 pt-8">
                                    { (matchFormat === 'team' ? stats.teams : stats.players).slice(0, 3).map((item, i) => (
                                        <div key={i} className="text-center p-4 rounded-3xl bg-slate-50 border border-slate-100">
                                            <div className="text-[10px] font-black text-slate-400 uppercase mb-1">{i === 0 ? t.winner : i === 1 ? t.runnerUp : t.thirdPlace}</div>
                                            <div className={`font-black uppercase text-sm ${i === 0 ? 'text-yellow-600' : 'text-slate-700'} line-clamp-1`}>{item.name}</div>
                                        </div>
                                    ))}
                                </div>
                                <div className="text-center mt-10">
                                    <p className="text-[9px] font-black text-lime-600 uppercase tracking-widest px-4 max-w-md mx-auto mb-4">{t.community}</p>
                                    <div className="text-[8px] font-bold text-slate-300 uppercase tracking-widest italic">myPickleball by <a href="https://wa.me/60135792215" target="_blank" className="underline decoration-dotted transition-colors">Pahan</a></div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
