<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball Pro-Maker by Pahan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        
        // Inisialisasi Firebase
        const firebaseConfig = JSON.parse(window.__firebase_config || '{}');
        const appId = window.__app_id || 'pickleball-pro-pahan';
        const initialToken = window.__initial_auth_token;
        
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const trophyNames = [
            "Piala Merdeka",
            "Piala Akhir Tahun",
            "Piala Mingguan",
            "Cabaran Hujung Minggu",
            "Pickleball Smash Cup",
            "Liga Persahabatan Pahan",
            "Piala Juara Kampung",
            "The Pickleball Masters",
            "Piala Santai Petang",
            "Battle of the Paddles"
        ];

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [sessions, setSessions] = useState([]);
            const [currentSessionId, setCurrentSessionId] = useState(null);
            const [view, setView] = useState('menu');
            const [sessionDate, setSessionDate] = useState(new Date().toISOString().split('T')[0]);
            const [sessionTitle, setSessionTitle] = useState('');
            
            // Input States
            const [individualName, setIndividualName] = useState('');
            const [manualTeamName, setManualTeamName] = useState('');
            const [manualMembers, setManualMembers] = useState('');
            
            // Data States
            const [players, setPlayers] = useState([]); 
            const [teams, setTeams] = useState([]); 
            const [finalTeams, setFinalTeams] = useState([]); 
            const [schedule, setSchedule] = useState([]);
            const [scores, setScores] = useState({});
            const [playersPerTeam, setPlayersPerTeam] = useState(2);
            const [isGenerated, setIsGenerated] = useState(false);
            const [activeTab, setActiveTab] = useState('players');
            const [isSaving, setIsSaving] = useState(false);
            const [sessionToDelete, setSessionToDelete] = useState(null);

            // Fungsi untuk pilih nama piala rawak
            const randomizeTrophy = () => {
                const randomName = trophyNames[Math.floor(Math.random() * trophyNames.length)];
                setSessionTitle(randomName);
            };

            useEffect(() => {
                randomizeTrophy();
                const initAuth = async () => {
                    try {
                        if (initialToken) await auth.signInWithCustomToken(initialToken);
                        else await auth.signInAnonymously();
                    } catch (error) { console.error("Auth Error:", error); }
                };
                initAuth();
                const unsubscribe = auth.onAuthStateChanged((u) => setUser(u));
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const sessionsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions');
                return sessionsRef.onSnapshot((snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setSessions(data.sort((a, b) => new Date(b.date) - new Date(a.date)));
                }, (error) => console.error("Snapshot error:", error));
            }, [user]);

            useEffect(() => {
                if (!user || !currentSessionId) return;
                const sessionDoc = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions').doc(currentSessionId);
                return sessionDoc.onSnapshot((snapshot) => {
                    if (snapshot.exists) {
                        const data = snapshot.data();
                        setPlayers(data.players || []);
                        setSessionTitle(data.title || 'Tiada Nama');
                        
                        let parsedTeams = [];
                        let parsedFinalTeams = [];
                        try {
                            parsedTeams = data.teams ? (typeof data.teams === 'string' ? JSON.parse(data.teams) : data.teams) : [];
                            parsedFinalTeams = data.finalTeams ? (typeof data.finalTeams === 'string' ? JSON.parse(data.finalTeams) : data.finalTeams) : [];
                        } catch (e) { console.error("Parse error", e); }
                        
                        setTeams(parsedTeams);
                        setFinalTeams(parsedFinalTeams);
                        setSchedule(data.schedule || []);
                        setScores(data.scores || {});
                        setPlayersPerTeam(data.playersPerTeam || 2);
                        setIsGenerated(data.isGenerated || false);
                        setSessionDate(data.date);
                    }
                });
            }, [user, currentSessionId]);

            const createNewSession = async () => {
                if (!user) return;
                setIsSaving(true);
                try {
                    const sessionsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions');
                    const newDoc = await sessionsRef.add({
                        title: sessionTitle || "Piala Tanpa Nama",
                        date: sessionDate,
                        players: [],
                        teams: JSON.stringify([]),
                        finalTeams: JSON.stringify([]),
                        schedule: [],
                        scores: {},
                        playersPerTeam: 2,
                        isGenerated: false,
                        createdAt: new Date().toISOString()
                    });
                    setCurrentSessionId(newDoc.id);
                    setView('active');
                    setActiveTab('players');
                } catch (e) { console.error(e); } finally { setIsSaving(false); }
            };

            const deleteSession = async (id) => {
                if (!user) return;
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions').doc(id).delete();
                    setSessionToDelete(null);
                } catch (e) { console.error("Delete Error:", e); }
            };

            const syncToCloud = async (newData) => {
                if (!user || !currentSessionId) return;
                try {
                    const sessionDoc = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions').doc(currentSessionId);
                    await sessionDoc.update(newData);
                } catch (e) { console.error("Update Error:", e); }
            };

            const addIndividualPlayer = (e) => {
                e.preventDefault();
                if (!individualName.trim()) return;
                const names = individualName.split(/[\n,]+/).map(n => n.trim()).filter(n => n !== "" && !players.includes(n));
                const updatedPlayers = [...players, ...names];
                setPlayers(updatedPlayers);
                syncToCloud({ players: updatedPlayers });
                setIndividualName('');
            };

            const removeIndividualPlayer = (idx) => {
                const updatedPlayers = players.filter((_, i) => i !== idx);
                setPlayers(updatedPlayers);
                syncToCloud({ players: updatedPlayers });
            };

            const addManualTeam = (e) => {
                e.preventDefault();
                if (!manualTeamName.trim() || !manualMembers.trim()) return;
                const membersArr = manualMembers.split(/[\n,]+/).map(n => n.trim()).filter(n => n !== "");
                const newTeam = { name: manualTeamName.trim(), members: membersArr };
                const updatedTeams = [...teams, newTeam];
                setTeams(updatedTeams);
                syncToCloud({ teams: JSON.stringify(updatedTeams) });
                setManualTeamName('');
                setManualMembers('');
            };

            const removeTeam = (idx) => {
                const updatedTeams = teams.filter((_, i) => i !== idx);
                setTeams(updatedTeams);
                syncToCloud({ teams: JSON.stringify(updatedTeams) });
            };

            const handleStartMatch = () => {
                const combinedTeams = [...teams];
                if (players.length > 0) {
                    const shuffledIndividuals = [...players].sort(() => Math.random() - 0.5);
                    for (let i = 0; i < shuffledIndividuals.length; i += playersPerTeam) {
                        const members = shuffledIndividuals.slice(i, i + playersPerTeam);
                        combinedTeams.push({
                            name: `Mix Team ${Math.floor(i/playersPerTeam) + 1}`,
                            members: members
                        });
                    }
                }
                if (combinedTeams.length < 2) return;
                const newSchedule = [];
                for (let i = 0; i < combinedTeams.length; i++) {
                    for (let j = i + 1; j < combinedTeams.length; j++) {
                        newSchedule.push({ home: i, away: j });
                    }
                }
                syncToCloud({
                    finalTeams: JSON.stringify(combinedTeams),
                    schedule: newSchedule,
                    scores: {},
                    isGenerated: true,
                    playersPerTeam
                });
                setActiveTab('schedule');
            };

            const updateScore = (matchIdx, side, value) => {
                const newScores = { 
                    ...scores, 
                    [matchIdx]: { ...scores[matchIdx], [side]: parseInt(value) || 0, completed: true } 
                };
                setScores(newScores);
                syncToCloud({ scores: newScores });
            };

            const stats = useMemo(() => {
                if (!finalTeams || !finalTeams.length) return { teams: [], players: [] };
                const teamStats = finalTeams.map((t, i) => ({ id: i, name: t.name, points: 0, wins: 0, members: t.members }));
                const pStats = {};
                finalTeams.forEach(t => t.members.forEach(p => pStats[p] = { points: 0, wins: 0 }));
                Object.entries(scores).forEach(([idx, data]) => {
                    if (!data.completed) return;
                    const m = schedule[idx];
                    if (!m) return;
                    const hScore = data.home || 0;
                    const aScore = data.away || 0;
                    if (hScore > aScore) {
                        const winIdx = m.home;
                        if (teamStats[winIdx]) {
                            teamStats[winIdx].points += 2;
                            teamStats[winIdx].wins += 1;
                            finalTeams[winIdx].members.forEach(p => { if(pStats[p]) { pStats[p].points += 2; pStats[p].wins += 1; } });
                        }
                    } else if (aScore > hScore) {
                        const winIdx = m.away;
                        if (teamStats[winIdx]) {
                            teamStats[winIdx].points += 2;
                            teamStats[winIdx].wins += 1;
                            finalTeams[winIdx].members.forEach(p => { if(pStats[p]) { pStats[p].points += 2; pStats[p].wins += 1; } });
                        }
                    }
                });
                return {
                    teams: [...teamStats].sort((a, b) => b.points - a.points),
                    players: Object.entries(pStats).map(([name, s]) => ({ name, ...s })).sort((a, b) => b.points - a.points)
                };
            }, [scores, finalTeams, schedule]);

            if (!user && sessions.length === 0) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 text-slate-400">
                        <Icon name="loader" className="w-10 h-10 animate-spin mb-4" />
                        <p className="font-bold uppercase tracking-widest text-xs">Menyambung ke Pahan Database...</p>
                    </div>
                );
            }

            if (view === 'menu') {
                return (
                    <div className="min-h-screen p-4 md:p-8 max-w-2xl mx-auto animate-in fade-in duration-500">
                        <header className="text-center mb-10">
                            <div className="inline-flex items-center justify-center p-4 bg-lime-400 rounded-3xl mb-4 shadow-xl">
                                <Icon name="trophy" className="w-10 h-10 text-slate-900" />
                            </div>
                            <h1 className="text-4xl font-black tracking-tight text-slate-900">Pickleball Pro-Maker</h1>
                            <p className="text-slate-500 italic mt-1 font-medium tracking-tight">by Pahan</p>
                        </header>

                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 mb-6">
                            <h2 className="font-bold mb-4 flex items-center gap-2 text-lime-600"><Icon name="plus" /> Sesi Baru</h2>
                            <div className="space-y-4">
                                <div>
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1.5 ml-1">Nama Piala / Kejohanan</label>
                                    <div className="flex gap-2">
                                        <input 
                                            type="text" 
                                            value={sessionTitle} 
                                            onChange={e => setSessionTitle(e.target.value)} 
                                            placeholder="cth: Piala Merdeka..." 
                                            className="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:ring-2 focus:ring-lime-500" 
                                        />
                                        <button 
                                            onClick={randomizeTrophy}
                                            className="bg-slate-100 text-slate-500 p-3 rounded-xl hover:bg-slate-200 transition-colors"
                                            title="Pilih secara rawak"
                                        >
                                            <Icon name="refresh-cw" className="w-5 h-5" />
                                        </button>
                                    </div>
                                </div>
                                <div className="flex flex-col sm:flex-row gap-3">
                                    <div className="flex-1">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1.5 ml-1">Tarikh</label>
                                        <input type="date" value={sessionDate} onChange={e => setSessionDate(e.target.value)} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:ring-2 focus:ring-lime-500" />
                                    </div>
                                    <div className="flex items-end">
                                        <button onClick={createNewSession} disabled={isSaving} className="w-full sm:w-auto bg-slate-900 text-white px-8 py-3 rounded-xl font-bold hover:bg-slate-800 transition-all disabled:opacity-50 h-[50px]">
                                            {isSaving ? "Mula..." : "Mula Sesi"}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="space-y-3">
                            <h2 className="text-xs font-black text-slate-400 uppercase tracking-widest px-2 flex items-center gap-2">
                                <Icon name="history" className="w-4 h-4" /> Rekod Sesi Terdahulu
                            </h2>
                            {sessions.map(s => (
                                <div key={s.id} className="group relative">
                                    <button onClick={() => { setCurrentSessionId(s.id); setView('active'); }} className="w-full flex items-center justify-between p-5 bg-white rounded-2xl border border-slate-100 hover:border-lime-400 hover:shadow-md transition-all">
                                        <div className="flex items-center gap-4 text-left">
                                            <div className="w-12 h-12 bg-slate-50 rounded-xl flex items-center justify-center font-black text-slate-400 group-hover:bg-lime-50 group-hover:text-lime-600">
                                                {new Date(s.date).getDate()}
                                            </div>
                                            <div>
                                                <div className="font-bold text-slate-800 line-clamp-1">{s.title || "Sesi Tanpa Nama"}</div>
                                                <div className="text-[10px] text-slate-400 font-bold uppercase tracking-tight">
                                                    {new Date(s.date).toLocaleDateString('ms-MY', { month: 'short', year: 'numeric', day: 'numeric' })} • {s.isGenerated ? "Selesai" : "Draf"}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <button 
                                                onClick={(e) => { e.stopPropagation(); setSessionToDelete(s.id); }}
                                                className="p-2 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all opacity-0 group-hover:opacity-100"
                                            >
                                                <Icon name="trash-2" className="w-5 h-5" />
                                            </button>
                                            <Icon name="chevron-right" className="text-slate-300 group-hover:text-lime-500" />
                                        </div>
                                    </button>
                                </div>
                            ))}
                        </div>

                        {sessionToDelete && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl animate-in zoom-in-95 duration-200">
                                    <h3 className="text-xl font-black text-slate-900 mb-2">Padam Sesi?</h3>
                                    <p className="text-slate-500 text-sm mb-6 font-medium">Data sesi ini akan dibuang secara kekal. Tindakan ini tidak boleh dibatalkan.</p>
                                    <div className="flex gap-3">
                                        <button onClick={() => setSessionToDelete(null)} className="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition-all">Batal</button>
                                        <button onClick={() => deleteSession(sessionToDelete)} className="flex-1 py-3 bg-red-500 text-white rounded-xl font-bold hover:bg-red-600 transition-all shadow-lg shadow-red-100">Padam</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-6xl mx-auto pb-24 animate-in fade-in duration-300">
                    <header className="flex items-center justify-between mb-8">
                        <button onClick={() => setView('menu')} className="flex items-center gap-2 text-slate-500 font-bold hover:text-slate-900 transition-all">
                            <Icon name="chevron-left" /> Menu Utama
                        </button>
                        <div className="text-right">
                            <div className="text-[10px] font-black text-slate-400 uppercase tracking-tighter">Acara:</div>
                            <div className="font-bold text-slate-900 italic tracking-tight">{sessionTitle}</div>
                            <div className="text-[10px] text-slate-400 font-bold">{new Date(sessionDate).toLocaleDateString('ms-MY')}</div>
                        </div>
                    </header>

                    <nav className="flex bg-white p-1 rounded-xl border border-slate-200 mb-6 sticky top-4 z-10 shadow-sm overflow-x-auto">
                        {[{ id: 'players', label: 'Pendaftaran', icon: 'users' }, { id: 'schedule', label: 'Jadual', icon: 'calendar' }, { id: 'leaderboard', label: 'Kedudukan', icon: 'medal' }].map(tab => (
                            <button key={tab.id} onClick={() => isGenerated || tab.id === 'players' ? setActiveTab(tab.id) : null} className={`flex-1 min-w-[100px] flex items-center justify-center gap-2 py-3 rounded-lg text-sm font-bold capitalize transition-all ${activeTab === tab.id ? 'bg-slate-900 text-white' : 'text-slate-500 hover:bg-slate-50'} ${!isGenerated && tab.id !== 'players' ? 'opacity-30 cursor-not-allowed' : ''}`}>
                                <Icon name={tab.icon} className="w-4 h-4" /> {tab.label}
                            </button>
                        ))}
                    </nav>

                    {activeTab === 'players' && (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                    <h2 className="font-bold mb-4 flex items-center gap-2 text-orange-600 uppercase tracking-tight italic text-sm">
                                        <Icon name="user-plus" /> Daftar Pasukan Tetap
                                    </h2>
                                    <form onSubmit={addManualTeam} className="space-y-3">
                                        <input type="text" value={manualTeamName} onChange={e => setManualTeamName(e.target.value)} placeholder="Nama Pasukan" className="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-orange-500 font-bold" />
                                        <textarea value={manualMembers} onChange={e => setManualMembers(e.target.value)} placeholder="Nama Ahli (asingkan dengan koma)" className="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-orange-500 min-h-[80px] font-medium" />
                                        <button className="w-full bg-orange-500 text-white py-3 rounded-xl font-bold hover:bg-orange-600 transition-colors shadow-lg shadow-orange-100">Tambah Pasukan</button>
                                    </form>
                                </div>
                                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                    <h2 className="font-bold mb-4 flex items-center gap-2 text-lime-600 uppercase tracking-tight italic text-sm">
                                        <Icon name="user" /> Daftar Pemain Individu ({players.length})
                                    </h2>
                                    <form onSubmit={addIndividualPlayer} className="flex gap-2 mb-4">
                                        <input type="text" value={individualName} onChange={e => setIndividualName(e.target.value)} placeholder="Nama pemain..." className="flex-1 px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-lime-500" />
                                        <button className="bg-slate-900 text-white px-5 rounded-xl"><Icon name="plus" /></button>
                                    </form>
                                    <div className="max-h-[200px] overflow-y-auto custom-scrollbar space-y-1">
                                        {players.length === 0 ? <p className="text-xs text-slate-400 italic text-center py-4">Tiada pemain individu</p> : 
                                            players.map((p, i) => (
                                                <div key={i} className="flex justify-between items-center px-3 py-2 bg-slate-50 rounded-lg text-sm font-bold">
                                                    <span>{i + 1}. {p}</span>
                                                    <button onClick={() => removeIndividualPlayer(i)} className="text-slate-300 hover:text-red-500"><Icon name="trash-2" className="w-3 h-3" /></button>
                                                </div>
                                            ))
                                        }
                                    </div>
                                </div>
                            </div>
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm min-h-[400px]">
                                    <h2 className="font-bold mb-4 flex items-center gap-2 text-slate-700 uppercase tracking-tight italic text-sm">
                                        <Icon name="layout-grid" /> Ringkasan Pasukan Berdaftar
                                    </h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-8">
                                        {teams.length === 0 && players.length === 0 ? 
                                            <div className="col-span-full py-20 text-center text-slate-300 italic border-2 border-dashed border-slate-100 rounded-3xl">Sila daftar pasukan atau individu</div> : 
                                            teams.map((t, i) => (
                                                <div key={i} className="p-4 bg-slate-50 rounded-2xl border border-slate-100 relative group">
                                                    <button onClick={() => removeTeam(i)} className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500"><Icon name="trash-2" className="w-3 h-3" /></button>
                                                    <div className="text-xs font-black text-orange-600 uppercase mb-1">{t.name}</div>
                                                    <div className="text-[10px] text-slate-400 font-bold">{t.members.join(' • ')}</div>
                                                </div>
                                            ))
                                        }
                                        {players.length > 0 && (
                                            <div className="p-4 bg-lime-50 border border-lime-100 rounded-2xl sm:col-span-1">
                                                <div className="text-xs font-black text-lime-700 uppercase mb-1">Kumpulan Individu</div>
                                                <div className="text-[10px] text-lime-600 font-bold italic">{players.length} Pemain akan dijana menjadi "Mix Team"</div>
                                            </div>
                                        )}
                                    </div>
                                    <div className="border-t border-slate-100 pt-6">
                                        <label className="text-[10px] font-black text-slate-400 mb-3 block uppercase tracking-widest text-center">Saiz Mix Team (Individu)</label>
                                        <div className="flex justify-center gap-3 mb-6">
                                            {[2, 3, 4].map(n => (
                                                <button key={n} onClick={() => setPlayersPerTeam(n)} className={`w-12 h-12 rounded-xl border-2 font-black ${playersPerTeam === n ? 'border-lime-500 bg-lime-50 text-lime-700' : 'border-slate-100 text-slate-300'}`}>{n}</button>
                                            ))}
                                        </div>
                                        <button onClick={handleStartMatch} className="w-full py-5 bg-slate-900 text-white rounded-2xl font-black text-lg shadow-xl hover:bg-slate-800 transition-all active:scale-95 uppercase italic tracking-tight">
                                            Bina Jadual Perlawanan
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'schedule' && (
                        <div className="grid gap-4 animate-in slide-in-from-bottom-4 duration-300">
                             <div className="flex items-center justify-between px-2">
                                <h2 className="text-xl font-black text-slate-800 uppercase italic">Jadual Perlawanan</h2>
                                <div className="text-[10px] font-black bg-slate-900 text-white px-3 py-1 rounded-full">{schedule.length} Match Total</div>
                            </div>
                            {schedule.map((m, idx) => (
                                <div key={idx} className={`p-6 bg-white rounded-3xl border-2 transition-all ${scores[idx]?.completed ? 'border-lime-100' : 'border-slate-100 shadow-sm'}`}>
                                    <div className="flex justify-between text-[8px] font-black text-slate-300 uppercase tracking-widest mb-6">
                                        <span>MATCH #{idx+1}</span>
                                        {scores[idx]?.completed && <span className="text-lime-500 flex items-center gap-1 font-bold">SELESAI</span>}
                                    </div>
                                    <div className="grid grid-cols-[1fr,auto,1fr] items-center text-center gap-4">
                                        <div className="space-y-2">
                                            <div className="font-black text-sm text-slate-800 uppercase tracking-tight">{finalTeams[m.home]?.name}</div>
                                            <div className="flex flex-wrap justify-center gap-1">
                                                {finalTeams[m.home]?.members.map((p, i) => <span key={i} className="text-[9px] bg-slate-50 px-1.5 py-0.5 rounded font-bold text-slate-400">{p}</span>)}
                                            </div>
                                            <input type="number" value={scores[idx]?.home || ''} onChange={e => updateScore(idx, 'home', e.target.value)} placeholder="0" className="w-16 mx-auto py-2 bg-slate-50 border rounded-xl text-center font-black text-xl outline-none focus:border-lime-400" />
                                        </div>
                                        <div className="flex flex-col items-center">
                                            <Icon name="swords" className="w-5 h-5 text-slate-200" />
                                            <span className="text-[8px] font-black text-slate-300 mt-1 uppercase">Vs</span>
                                        </div>
                                        <div className="space-y-2">
                                            <div className="font-black text-sm text-slate-800 uppercase tracking-tight">{finalTeams[m.away]?.name}</div>
                                            <div className="flex flex-wrap justify-center gap-1">
                                                {finalTeams[m.away]?.members.map((p, i) => <span key={i} className="text-[9px] bg-slate-50 px-1.5 py-0.5 rounded font-bold text-slate-400">{p}</span>)}
                                            </div>
                                            <input type="number" value={scores[idx]?.away || ''} onChange={e => updateScore(idx, 'away', e.target.value)} placeholder="0" className="w-16 mx-auto py-2 bg-slate-50 border rounded-xl text-center font-black text-xl outline-none focus:border-lime-400" />
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {activeTab === 'leaderboard' && (
                        <div className="space-y-10 animate-in slide-in-from-bottom-4 duration-300">
                            <div className="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
                                <h2 className="text-lg font-black p-6 bg-slate-50 border-b border-slate-100 flex items-center gap-2 uppercase italic">
                                    <Icon name="layout-grid" className="text-lime-500" /> Ranking Pasukan
                                </h2>
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-50/50 border-b border-slate-100">
                                        <tr className="text-[10px] font-black text-slate-400 uppercase">
                                            <th className="px-6 py-4">Pos</th>
                                            <th className="px-6 py-4">Nama Pasukan</th>
                                            <th className="px-6 py-4 text-center">Poin (Menang=2)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {stats.teams.map((t, i) => (
                                            <tr key={i} className={`border-b border-slate-50 last:border-0 ${i === 0 ? 'bg-lime-50/20' : ''}`}>
                                                <td className="px-6 py-4">
                                                    <div className={`w-7 h-7 rounded-full flex items-center justify-center font-black text-[10px] ${i === 0 ? 'bg-yellow-400 text-white shadow-lg' : 'bg-slate-100 text-slate-400'}`}>{i+1}</div>
                                                </td>
                                                <td className="px-6 py-4 font-bold text-slate-800 uppercase tracking-tight text-xs">{t.name}</td>
                                                <td className="px-6 py-4 text-center font-black text-slate-900">{t.points}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                <h2 className="col-span-full text-lg font-black uppercase italic flex items-center gap-2 text-slate-800">
                                    <Icon name="medal" className="text-orange-500" /> Pemain Paling Kuat (Individu)
                                </h2>
                                {stats.players.map((p, i) => (
                                    <div key={p.name} className={`p-5 bg-white rounded-3xl border-2 flex justify-between items-center transition-all ${i === 0 ? 'border-orange-200 bg-orange-50/30 shadow-md' : 'border-slate-100 shadow-sm'}`}>
                                        <div className="flex items-center gap-3">
                                            <div className={`w-8 h-8 rounded-full flex items-center justify-center font-black text-xs ${i === 0 ? 'bg-orange-500 text-white shadow-md' : 'bg-slate-100 text-slate-400'}`}>{i+1}</div>
                                            <div>
                                                <div className="font-black text-slate-800 text-xs">{p.name}</div>
                                                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">{p.wins} Wins</div>
                                            </div>
                                        </div>
                                        <div className="font-black text-base text-slate-900 bg-white px-3 py-1 rounded-xl border border-slate-100">{p.points}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
